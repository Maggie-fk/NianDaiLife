  function renderHeader(){
    const s = gameState;
    $('dateMain').textContent = s.year + '年' + s.month + '月';
    $('dateSub').textContent = '第 ' + s.turn + ' 个月 · ' + SEASONS[s.month - 1] + ' · ' + JIEQI[s.month - 1];
    $('seasonSeal').textContent = SEASON_CHARS[s.month - 1];
  }

  function familyIncome(s){
    return s.npcs.filter(n => n.inFamily).reduce((a,n) => a + (n.income || 0), 0);
  }

  function gradeOfSchool(s){
    const p = s.player;
    if(!p.school) return 0;
    if(p.edu === '小学') return clamp(p.age - 6, 1, 6);
    if(p.edu === '初中') return clamp(p.age - 11, 1, 3);
    if(p.edu === '高中' || p.edu === '中专') return clamp(p.age - 14, 1, 3);
    if(p.edu === '大学'){
      return clamp(p.uniGrade || (p.age - 17), 1, 4);
    }
    return 0;
  }

  function statusOf(s){
    const p = s.player;
    if(p.business) return '个体户';
    if(p.job) return p.job;
    if(p.school){ const g = gradeOfSchool(s); return p.school + (g ? '·' + g + '年级' : ''); }
    if(p.age < 7) return '学龄前';
    if(p.age < 16 && !p.school) return '待学';
    if(p.age < 16) return '学生';
    return '待业';
  }

  function renderProfile(){
    const s = gameState, p = s.player;

    $('pAvatar').textContent = p.surname;
    $('pName').textContent = p.name;
    $('pAge').textContent = p.age + '岁';
    const grade = gradeOfSchool(s);
    const stageName = p.edu === '大学' ? '大学' : (p.edu || '');
    const gradeText = p.school && grade ? ' · ' + stageName + grade + '年级' : '';
    const roleText = (p.roles && p.roles.length) ? ' · ' + p.roles.join('·') : '';
    $('pSub').textContent = p.gender + ' · ' + p.birthY + '年生' + gradeText + ' · ' +
      (p.edu === '大学' ? '现居' + uniCityOf(s) : s.city.name + (s.city.kind === '城市' ? '' : ' · ' + s.city.kind)) + roleText;

    const extraTags = [];
    if(s.flags.baosong) extraTags.push('保送');
    if(s.flags.abroadExchange) extraTags.push('出国交流');
    if(s.flags.abroadSchool) extraTags.push(s.flags.uniAbroad ? '交换生' : '留学');
    if(s.flags.militaryUni) extraTags.push('军校');
    if(s.flags.compSponsor) extraTags.push(s.flags.compSponsor === 'teacher' ? '学校资助' : '地方资助');
    if(s.flags.youthClass) extraTags.push('少年班');
    if(s.flags.studyAbroad) extraTags.push('留学');
    (s.flags.prodigy || []).forEach(h => extraTags.push('神童·' + h));
    $('pTags').innerHTML = p.tags.concat(extraTags).map(t => '<span class="tag">' + esc(t) + '</span>').join('');

    $('pDesc').textContent = p.look + '。' + (p.extra ? p.extra + '。' : '') +
      '在' + s.city.name + '的' + s.city.lane + '长大，' +
      '街坊都说这孩子' + p.tags.slice(0,2).join('、') + '。';

    $('pMoney').textContent = fmtY(p.money);
    $('pIncome').textContent = p.income ? fmtY(p.income) : (p.business ? '经营中' : '暂无');
    $('pStatus').textContent = statusOf(s);

    const tile = (k, v) => '<div class="stat"><span>' + k + '</span><b' + (typeof v === 'string' ? ' style="font-size:10px"' : '') + '>' + esc(v) + '</b></div>';
    const baseTiles = tile('成绩', academicLabel(p)) + tile('名声', Math.round(p.rep || 0)) +
      BASE_KEYS.map(k => tile(k, Math.floor(p.skills[k] || 0))).join('');
    const skillTiles = SKILL_KEYS.filter(k => BASE_KEYS.indexOf(k) < 0).map(k => tile(k, Math.floor(p.skills[k] || 0))).join('');
    $('statGrid').innerHTML = '<div class="stat-group-title">基础</div>' + baseTiles +
      '<div class="stat-group-title">技能</div>' + skillTiles;

    const tested = p.exams && p.exams.length;
    $('gradeLine').innerHTML = tested
      ? '学业成绩：<b>' + esc(p.academicGrade) + '</b> · 综合 ' + Math.round(p.academicScore || 0) + ' 分 · 已考 ' + p.exams.length + ' 次'
      : '学业成绩：<b>待考</b> · 平时学业 ' + Math.round((p.skills['学业'] || 0)) + ' 分';
    $('hpBar').style.width = clamp(p.health, 0, 100) + '%';
    $('moodBar').style.width = clamp(p.mood, 0, 100) + '%';
    $('hpText').textContent = Math.round(p.health) + ' ' + healthShort(p.health);
    $('moodText').textContent = Math.round(p.mood) + ' ' + moodShort(p.mood);
  }

  function actPool(s){
    return s.player.edu === '大学' ? UNI_ACTS : AFTER_ACTS;
  }

  const AFTER_YEAR_CAP = {
    '学业':8,'竞赛':12,'手艺':8,'见闻':8,'胆量':8,'人缘':8,'英语':8,
    '唱歌':10,'跳舞':10,'画画':10,'弹琴':10,'练武':10,'运动':10
  };

  function isVacation(s){
    return [1,2,7,8].indexOf(s.month) >= 0;
  }

  function schoolStageOf(s){
    const p = s.player;
    if(!p.school || p.job) return null;
    const vac = isVacation(s);
    if(p.edu === '中专') return {name:'中专', slots:vac ? 5 : 2, end:vac ? '假期，时间宽裕' : '下午五点'};
    if(p.edu === '小学' || (!p.edu && p.age <= 11)) return {name:'小学', slots:vac ? 7 : 3, end:vac ? '假期，时间宽裕' : '下午四点'};
    if(p.edu === '初中') return {name:'初中', slots:vac ? 5 : 2, end:vac ? '假期，时间宽裕' : '下午五点半'};
    if(p.edu === '高中') return {name:'高中', slots:vac ? 3 : 1, end:vac ? '假期，时间宽裕' : '下午六点'};
    if(p.edu === '大学') return {name:'大学', slots:4, end:'自己安排'};
    if(p.age <= 11) return {name:'小学', slots:vac ? 7 : 3, end:vac ? '假期，时间宽裕' : '下午四点'};
    if(p.age <= 14) return {name:'初中', slots:vac ? 5 : 2, end:vac ? '假期，时间宽裕' : '下午五点半'};
    if(p.age <= 17) return {name:'高中', slots:vac ? 3 : 1, end:vac ? '假期，时间宽裕' : '下午六点'};
    if(p.age <= 21) return {name:'大学', slots:vac ? 7 : 5, end:'自己安排'};
    return null;
  }
  function isSchoolMonth(s){
    return [3,4,5,6,9,10,11,12].indexOf(s.month) >= 0;
  }
  function ensureAfter(s){
    const key = s.year * 100 + s.month;
    if(!s.after || s.after.key !== key) s.after = {key:key, picked:[], done:false};
  }
  function renderAfter(){
    const s = gameState, p = s.player, card = $('afterCard');
    if(!card) return;
    const st = schoolStageOf(s);
    if(!st){ card.hidden = true; return; }
    card.hidden = false;
    ensureAfter(s);
    const mode = isVacation(s) ? 'vac' : 'term';
    const plan = s.plans && s.plans[mode];
    const picked = s.after.picked || [];
    const uni = p.edu === '大学';
    if($('afterTitle')) $('afterTitle').textContent = uni ? '大学生活' : '放学之后';
    if($('afterEn')) $('afterEn').textContent = uni ? 'COLLEGE LIFE' : 'AFTER SCHOOL';

    $('afterInfo').innerHTML = (uni ? '大学生活：' : '放学时间：') + esc(st.end) + '。' +
      (s.after.done
        ? '这个月已经安排：' + esc(picked.join('、'))
        : '这个月还可以安排 ' + st.slots + ' 项' + (uni ? '活动' : '课后活动') + '。');
    const btn = $('btnAfter');
    if(btn){
      if(plan){
        btn.disabled = false;
        btn.textContent = '连续计划 · 剩 ' + plan.left + ' 月（可中断）';
      }else{
        btn.disabled = !!s.after.done;
        btn.textContent = s.after.done ? '本月已安排' : (uni ? '安排这个月的大学生活' : '安排这个月的放学后');
      }

  function applyAfterItems(s, items, usePrivate){
    const p = s.player;
    let spend = 0;
    items.forEach(it => {
      if(it.custom) return;
      const a = actPool(s).find(x => x.id === it.id);
      if(a) spend += afterCost(s, a) * it.count;
    });
    spend = Math.round(spend * 10) / 10;
    let compSpend = 0;
    items.forEach(it => {
      const a = actPool(s).find(x => x.id === it.id);
      if(a && a.kind === 'competition') compSpend += (a.cost || 0) * it.count;
    });
    let sponsorUsed = 0;
    if(!usePrivate && (s.flags.sponsorFund || 0) > 0 && compSpend > 0){
      sponsorUsed = Math.min(s.flags.sponsorFund, compSpend);
      s.flags.sponsorFund = Math.round((s.flags.sponsorFund - sponsorUsed) * 10) / 10;
      spend = Math.round((spend - sponsorUsed) * 10) / 10;
    }
    let secret = !!usePrivate;
    if(secret){
      if((p.money || 0) < spend) return {error:'私房钱不够'};
      p.money = Math.round(((p.money || 0) - spend) * 10) / 10;
    }else if((s.family.cash || 0) < spend){
      if((p.money || 0) >= spend){ p.money = Math.round(((p.money || 0) - spend) * 10) / 10; secret = true; }
      else return {error:'家里拿不出这笔钱'};
    }else{
      s.family.cash = Math.round(((s.family.cash || 0) - spend) * 10) / 10;
    }
    let capped = false;
    const names = [];
    items.forEach(it => {
      const a = it.custom || actPool(s).find(x => x.id === it.id);
      if(!a) return;
      for(let n = 0; n < it.count; n++){
        const eff = {};
        Object.keys(a.eff).forEach(k => {
          const v = a.eff[k];
          if(SKILL_KEYS.indexOf(k) >= 0 && AFTER_YEAR_CAP[k]){
            const used = p.afterUsed[k] || 0;
            const room = Math.max(0, AFTER_YEAR_CAP[k] - used);
            const use = Math.min(v, room);
            if(use > 0){ eff[k] = use; p.afterUsed[k] = used + use; }
            else capped = true;
          }else{
            eff[k] = v;
          }
        });
        const target = a.id === 'chore' ? resolveAff(s, '母亲') : null;
        applyEffects(eff, target);
        if(a.hobby){
          p.hobbies = p.hobbies || {};
          p.hobbies[a.hobby] = (p.hobbies[a.hobby] || 0) + 1;
        }
      }
      if(a.id === 'chore') p.choreCount = (p.choreCount || 0) + 1;
      if(a.id === 'play') p.playCount = (p.playCount || 0) + 1;
      if(a.id === 'read') p.readCount = (p.readCount || 0) + 1;
      names.push(a.name + (it.count > 1 ? '×' + it.count : ''));
    });
    s.after.done = true;
    s.after.picked = names;
    checkHobbyMastery(s);
    return {names:names, cost:spend, capped:capped, secret:secret, sponsor:sponsorUsed};
  }

  function openAfterSchool(){
    const s = gameState, p = s.player;
    const st = schoolStageOf(s);
    if(!st){ toast('现在不用上学'); return; }
    ensureAfter(s);
    const pm0 = isVacation(s) ? 'vac' : 'term';
    if(s.plans && s.plans[pm0]){ openPlanManage(); return; }
    if(s.after.done){ toast('这个月已经安排过了'); return; }
    const vac = isVacation(s);
    const mode = vac ? 'vac' : 'term';
    const slots = st.slots;
    const maxRepeat = vac ? 4 : 2;
    const sy = s.month >= 9 ? s.year : s.year - 1;
    if(!p.afterUsed || p.afterYear !== sy){ p.afterUsed = {}; p.afterYear = sy; }
    const counts = {};
    const custom = [];
    let total = 0;

    const acts = actPool(s);
    const cats = ['学习','竞赛','社团','兼职','运动','兴趣','休息','补习','娱乐','家务'];
    const catsUsed = cats.filter(c => acts.some(a => a.cat === c));
    const att = familyAttitude(s);
    let html = '<div class="fpick-tip">' + esc(st.name) + '，' + esc(st.end) + '。这个月可以安排 ' + slots +
      ' 项；同一项' + (vac ? '假期最多选 4 次' : '上学期间最多选 2 次') + '，重复选会累加效果。' +
      '<br>家里态度：<b>' + att.label + '</b> ｜ 存款 ' + fmtY(s.family.cash) + ' ｜ 兴趣不限额' +
      '<br>' + (p.edu === '大学' ? '大学活动不另收训练费，时间要自己安排。' : '补习、竞赛、兴趣都要花钱，从家庭存款里扣。') + ((s.flags.sponsorFund || 0) > 0 ? ' 竞赛资助余额：' + fmtY(s.flags.sponsorFund) : '') + '</div>';
    catsUsed.forEach(cat => {
      const list = acts.filter(a => a.cat === cat);
      if(!list.length) return;
      html += '<div class="plan-sec"><div class="plan-title">' + cat + '</div><div class="plan-grid">';
      list.forEach(a => {
        const no = afterRefusal(s, a, []) ? ' no' : '';
        html += '<button class="plan-btn after-act' + no + '" type="button" data-id="' + a.id + '" data-base="' + cat + '" data-cost="' + afterCost(s, a) + '"><b>' + a.name + '</b><span>' + cat + '</span>' +
          (afterCost(s, a) ? '<i>¥' + afterCost(s, a).toFixed(1) + '</i>' : (a.kind === 'competition' && s.flags.compSponsor ? '<i>资助</i>' : '')) + '</button>';
      });
      html += '</div></div>';
    });
    html += '<div class="plan-sec"><div class="plan-title">自己定</div>' +
      '<input class="setup-input" id="afterCustom" maxlength="16" placeholder="比如：去厂里捡废铁、跟邻居学修收音机">' +
      '<button class="plan-mini" id="afterCustomAdd" type="button" style="margin-top:6px">加入</button></div>';
    html += '<div class="plan-sec"><div class="plan-title">连续安排</div>' +
      '<select class="setup-input" id="afterMonths">' +
        '<option value="1">只安排这个月</option>' +
        '<option value="3">连续 3 个月</option>' +
        '<option value="6">连续 6 个月</option>' +
        '<option value="9">连续 9 个月</option>' +
        '<option value="12">连续 12 个月</option>' +
      '</select>' +
      '<div class="plan-note">跨假期只累计同一类月份：学期计划遇假期暂停，假期另排；升学后强制重选。</div>' +
      '<label class="plan-note"><input type="checkbox" id="afterSecret"> 用私房钱偷偷学（可绕过家里反对，现有 ' + fmtY(p.money) + '）</label>' +
      '</div>';
    html += '<div class="plan-note" id="afterCount">已选 0 / ' + slots + '</div>';
    html += '<div class="modal-actions" style="margin-top:8px"><button class="btn ghost" id="afterClear" type="button">清空</button><button class="btn" id="afterOk" type="button">就这样</button></div>';
    openModal(p.edu === '大学' ? '大学生活' : '放学之后', st.name + ' · 这个月怎么过', html);

    const costNow = () => {
      let c = 0;
      Object.keys(counts).forEach(id => {
        const a = actPool(s).find(x => x.id === id);
        if(a) c += afterCost(s, a) * counts[id];
      });
      return c;
    };
    const update = () => {
      const cnt = $('afterCount');
      if(cnt) cnt.textContent = '已选 ' + total + ' / ' + slots + ' · 费用 ' + fmtY(costNow());
      $('modalBody').querySelectorAll('.after-act').forEach(b => {
        const id = b.getAttribute('data-id');
        const n = counts[id] || 0;
        const span = b.querySelector('span');
        if(span) span.textContent = b.getAttribute('data-base') + (n ? ' ×' + n : '');
        b.classList.toggle('sel', n > 0);
      });
    };
    const body = $('modalBody');
    body.querySelectorAll('.after-act').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        if((counts[id] || 0) >= maxRepeat){ toast('同一项最多选 ' + maxRepeat + ' 次'); return; }
        if(total >= slots){ toast('最多只能安排 ' + slots + ' 项'); return; }
        const act = actPool(s).find(x => x.id === id);
        if(act){
          const selectedHobbies = [];
          Object.keys(counts).forEach(k => {
            const a2 = actPool(s).find(x => x.id === k);
            if(a2 && a2.hobby && counts[k] > 0 && selectedHobbies.indexOf(a2.hobby) < 0) selectedHobbies.push(a2.hobby);
          });
          const refusal = afterRefusal(s, act, selectedHobbies, !!($('afterSecret') && $('afterSecret').checked));
          if(refusal){ toast(refusal); return; }
        }
        counts[id] = (counts[id] || 0) + 1;
        total++;
        update();
      });
    });
    const addBtn = $('afterCustomAdd');
    if(addBtn) addBtn.addEventListener('click', () => {
      const inp = $('afterCustom');
      const v = (inp.value || '').trim();
      if(!v){ toast('写一项想做的事'); return; }
      if(total >= slots){ toast('最多只能安排 ' + slots + ' 项'); return; }
      const id = 'custom_' + custom.length;
      custom.push({id:id, name:v, cat:'自己定', eff:{'见闻':1.5,'心情':2}});
      counts[id] = 1;
      total++;
      inp.value = '';
      update();
      toast('已加入：' + v);
    });
    const clear = $('afterClear');
    if(clear) clear.addEventListener('click', () => {
      Object.keys(counts).forEach(k => delete counts[k]);
      total = 0;
      update();
    });
    const ok = $('afterOk');
    if(ok) ok.addEventListener('click', () => {
      if(!total){ toast('至少安排一项'); return; }
      const items = [];
      Object.keys(counts).forEach(id => {
        const a = actPool(s).find(x => x.id === id) || custom.find(x => x.id === id);
        if(a) items.push(Object.assign({count:counts[id]}, a, a.custom ? {custom:true} : {}));
      });
      const secret = !!($('afterSecret') && $('afterSecret').checked);
      const res = applyAfterItems(s, items, secret);
      if(res.error){ toast(res.error); return; }
      const months = parseInt(($('afterMonths') && $('afterMonths').value) || '1', 10) || 1;
      if(months > 1){
        s.plans = s.plans || {};
        s.plans[mode] = {stage:st.name, left:months - 1, items:items, secret:res.secret, mode:mode, names:res.names};
      }
      closeModal();
      renderAll();
      saveGame();
      toast('放学后：' + res.names.join('、') + (res.cost ? ' · 花了 ' + fmtY(res.cost) + (res.secret ? '（私房钱）' : '') : '') +
        (months > 1 ? ' · 已排 ' + months + ' 个月' : '') + (res.capped ? '（部分技能已达本学年上限）' : ''));
    });
  }

  const PARENT_TRAIT_POOL = ['开明','严厉','疼孩子','节俭','好面子','保守','重男轻女','要强','随和'];

  function pickParentTraits(){
    const out = [];
    while(out.length < 2){
      const t = pick(PARENT_TRAIT_POOL);
      if(out.indexOf(t) < 0) out.push(t);
    }
    return out;
  }

  function familyAttitude(s){
    const f = famNpc(s, '父亲'), m = famNpc(s, '母亲');
    const traits = [].concat(f && f.traits || [], m && m.traits || []);
    let score = 55;
    if(traits.indexOf('开明') >= 0) score += 18;
    if(traits.indexOf('疼孩子') >= 0) score += 10;
    if(traits.indexOf('随和') >= 0) score += 5;
    if(traits.indexOf('要强') >= 0) score += 3;
    if(traits.indexOf('好面子') >= 0) score += 2;
    if(traits.indexOf('严厉') >= 0) score -= 6;
    if(traits.indexOf('保守') >= 0) score -= 10;
    if(traits.indexOf('节俭') >= 0) score -= 6;
    if(traits.indexOf('重男轻女') >= 0) score += (s.player.gender === '女' ? -25 : 5);
    const jobs = ((f && f.job) || '') + ' ' + ((m && m.job) || '');
    if(/教师|医生|主任|科员|干部|工程师|编辑/.test(jobs)) score += 8;
    const cash = s.family.cash || 0;
    if(cash < 10) score -= 15;
    else if(cash < 30) score -= 5;
    else if(cash >= 100) score += 5;
    const aff = ((f && f.affinity) || 50) + ((m && m.affinity) || 50);
    if(aff / 2 >= 80) score += 5;
    if(aff / 2 < 50) score -= 10;
    if(s.family.equal) score += 10;
    score = clamp(Math.round(score), 0, 100);
    const label = score >= 70 ? '支持' : (score >= 45 ? '不反对' : '反对');
    let maxHobbies = 99;
    return {
      score:score, label:label, maxHobbies:maxHobbies,
      allowCompetition: score >= 60 && cash >= 5,
      allowPaid: score >= 40
    };
  }

  function afterCost(s, act){
    if(act && act.id === 'study_contest' && s.flags.compSponsor) return 0;
    return act ? (act.cost || 0) : 0;
  }

  function afterRefusal(s, act, selectedHobbies, secret){
    if(!act || !act.cost) return '';
    const cost0 = afterCost(s, act);
    if(cost0 <= 0) return '';
    if(secret) return (s.player.money || 0) >= cost0 ? '' : '私房钱不够。';
    if(act.kind === 'competition' && (s.flags.sponsorFund || 0) >= act.cost) return '';
    const att = familyAttitude(s);
    if((s.family.cash || 0) < cost0) return '家里存款不够，拿不出这项钱。';
    if(act.kind === 'hobby'){
      if(att.score < 40) return '家里说学这些没用，不让去。';

    }
    if(act.kind === 'competition' && !att.allowCompetition && !s.flags.compSponsor) return '家里不支持你搞竞赛。';
    if(act.kind === 'academic' && att.score < 25) return '家里说读书也没用，不愿再出钱。';
    return '';
  }

  function socialSkillOf(n){
    if(n && n.talent) return n.talent;
    const j = (n && n.job) || '';
    if(/教师|小学|中学|编辑|图书|校长|民办/.test(j)) return '识字';
    if(/会计|供销|主任|科员|干事|粮食|邮电|售货|保育/.test(j)) return '算术';
    if(/木匠|裁缝|绣|修表|钳工|挡车|检车|炉前|司机|师傅|铁匠/.test(j)) return '手艺';
    if(/医生|护士|军人|参谋|连长|记者|宣传|放映/.test(j)) return '见闻';
    if(/警察|军人|连长|司机|巡夜/.test(j)) return '胆量';
    return '人缘';
  }

  function socialPoolOf(s){
    if(s.socialPool && s.socialPool.turn === s.turn) return s.socialPool.list;
    const p = s.player;
    const list = [];
    if(p.edu === '大学'){
      const kinds = [
        {rel:'导师', job:'大学·教授', age:ri(40, 62)},
        {rel:'同学', job:'大学生', age:clamp(p.age + ri(-2, 2), 18, 24)},
        {rel:'社团', job:'大学生·社团负责人', age:clamp(p.age + ri(0, 3), 18, 24)}
      ];
      kinds.forEach(k => {
        const g = chance(.5) ? '男' : '女';
        let nm = '';
        for(let i = 0; i < 60; i++){
          const cand = pick(SURNAMES) + pick(g === '男' ? MALE_NAMES : FEMALE_NAMES);
          if(!s.npcs.some(n => n.name === cand) && !list.some(x => x.name === cand)){ nm = cand; break; }
        }
        if(!nm) nm = '小' + (g === '男' ? '林' : '芸') + list.length;
        const tmp = {job:k.job, relation:k.rel};
        list.push({name:nm, gender:g, age:k.age, job:k.job, relation:k.rel, bg:npcBackground(tmp), skill:socialSkillOf({job:k.job})});
      });
      s.socialPool = {turn:s.turn, list:list};
      return list;
    }
    const adultJobs = ['街道缝纫组·裁缝','国棉三厂·挡车工','小学·教师','供销社·售货员','区妇联·干事','木器社·木匠','医院·护士','运输公司·司机'];
    function mk(kind){
      const g = chance(.5) ? '男' : '女';
      let nm = '';
      for(let i = 0; i < 60; i++){
        const cand = pick(SURNAMES) + pick(g === '男' ? MALE_NAMES : FEMALE_NAMES);
        if(!s.npcs.some(n => n.name === cand) && !list.some(x => x.name === cand)){ nm = cand; break; }
      }
      if(!nm) nm = '小' + (g === '男' ? '林' : '芸') + list.length;
      let age, job, rel;
      if(kind === '长辈'){
        age = clamp(p.age + ri(18, 40), 20, 70);
        job = pick(adultJobs);
        rel = '街坊';
      }else if(kind === '晚辈'){
        age = Math.max(2, p.age - ri(4, 10));
        job = age >= 7 ? '小学生' : '在家';
        rel = '小孩';
      }else{
        age = clamp(p.age + ri(-2, 3), 3, 40);
        job = age < 7 ? '在家' : (age < 16 ? '小学生' : pick(['国棉三厂·学徒','供销社·售货员','街道小学·教师']));
        rel = '同龄人';
      }
      const tmp = {job:job, relation:rel};
      list.push({name:nm, gender:g, age:age, job:job, relation:rel, bg:npcBackground(tmp), skill:socialSkillOf({job:job})});
    }
    ['长辈','同龄','晚辈'].forEach(k => mk(k));
    s.socialPool = {turn:s.turn, list:list};
    return list;
  }

  function learnFromNpc(id){
    const s = gameState, n = s.npcs.find(x => x.id === id);
    if(!n) return;
    const skill = socialSkillOf(n);
    if(n.taughtTurn !== undefined && s.turn - n.taughtTurn < 6){ toast('他最近没什么可教你的了'); return; }
    const gain = r1(0.8 + (n.affinity >= 70 ? 0.5 : 0) + (n.inFamily ? 0.3 : 0));
    s.player.skills[skill] = clamp(s.player.skills[skill] + gain, 0, 100);
    n.affinity = clamp(n.affinity + 2, 0, 100);
    n.taughtTurn = s.turn;
    n.history.push({d:s.year + '年' + s.month + '月', t:'教了你一点' + skill});
    s.player.mood = clamp(s.player.mood + 1, 0, 100);
    toast(n.name + '教了你一点' + skill + ' +' + gain);
    renderSocial();
    renderAll();
    saveGame();
  }

  function meetCandidate(i){
    const s = gameState;
    if(s.flags.socialTurn === s.turn){ toast('这个月已经结识过一个人了'); return; }
    if(s.npcs.length >= 18){ toast('认识的人已经够多了，先顾好眼前这些'); return; }
    const pool = socialPoolOf(s);
    const c = pool[i];
    if(!c) return;
    const n = makeNpc({
      name:c.name, relation:c.relation, gender:c.gender, age:c.age, job:c.job,
      income:/小学|学徒|售货/.test(c.job) ? 0 : ri(18, 40),
      affinity:ri(30, 44), inFamily:false, mood:ri(58, 86)
    });
    n.bg = c.bg;
    n.talent = c.skill;
    n.taughtTurn = -99;
    n.thought = npcThought(n, s);
    s.npcs.push(n);
    s.flags.socialTurn = s.turn;
    toast('认识了 ' + c.name + '（' + c.relation + '）');
    renderSocial();
    renderAll();
    saveGame();
  }

        '<div class="npc-meta">' + n.gender + ' · ' + n.age + '岁 · 文化：' + esc(eduOf(n)) +
          ' ｜ ' + esc(jobWithTitle(n)) + (n.income ? ' ｜ 月入 ' + fmtY(n.income) : '') + '</div>' +
        '<div class="npc-meta">好感 ' + Math.round(n.affinity) + ' · ' + affLabel(n.affinity) +
          ((n.relation === '父亲' || n.relation === '母亲') && n.traits ? ' ｜ 性格：' + esc(n.traits.join('、')) : '') + '</div>' +
      '</div>'
    ).join('');

    openModal('家庭档案', f.cls.name + ' · ' + f.house.name, head + self + members +
      '<div class="npc-block"><div class="npc-meta">' + esc(f.note || '') + '</div></div>');
  }

  function npcBackground(n){
    if(n.bg) return n.bg;
    const c = gameState.city ? gameState.city.name : '本地';
    if(n.relation === '父亲' || n.relation === '母亲') return '本家，住在' + c;
    if(/医生|护士/.test(n.job || '')) return '家里有人在医院做事，日子过得仔细';
    if(/教师|小学|中学/.test(n.job || '')) return '书香人家，家里订着报纸';
    if(/工人|钳工|挡车|司机/.test(n.job || '')) return '双职工家庭，住在单位附近';
    if(/供销|主任|干事|科员|会计/.test(n.job || '')) return '单位家庭，消息比旁人灵通';
    if(/农民|生产队/.test(n.job || '')) return '家在城郊，院里有菜地';
    return '普通人家，住在' + c;
  }

  function npcHelp(n){
    const j = n.job || '';
    if(/医生|护士|卫生所/.test(j)) return '看病、拿药';
    if(/教师|小学|中学/.test(j)) return '识字、升学';
    if(/工人|钳工|挡车|师傅/.test(j)) return '手艺、进厂';
    if(/供销|主任|干事|科员|会计/.test(j)) return '票证、办事';
    if(/农民|生产队|大队/.test(j)) return '粮食、农活';
    if(/车|司机/.test(j)) return '跑腿、捎带';
    return '日常帮衬';
  }

  function meetPerson(){
    const s = gameState, p = s.player;
    let gender = chance(.5) ? '男' : '女';
    if(p.orientation === '同性' || p.orientation === '同性恋') gender = p.gender;
    if(p.orientation === '异性' || p.orientation === '异性恋') gender = p.gender === '男' ? '女' : '男';

    let name = '';
    for(let i=0;i<40;i++){
      const tryName = pick(SURNAMES) + pick(gender === '男' ? MALE_NAMES : FEMALE_NAMES);
      if(!s.npcs.some(n => n.name === tryName)){ name = tryName; break; }
    }
    if(!name) name = '小' + (gender === '男' ? '林' : '芸') + (s.turn % 90);

    const age = clamp(p.age + ri(-1, 4), 16, 26);
    const job = pick(['国棉三厂·挡车工','机器厂·钳工','供销社·售货员','小学·教师','医院·护士','文化馆·宣传员']);
    const n = makeNpc({
      name:name, relation:'朋友', gender:gender, age:age, job:job,
      income:ri(22, 40), affinity:ri(26, 42), inFamily:false, mood:ri(60, 86)
    });
    n.birthY = s.year - age;
    n.thought = npcThought(n, s);
    s.npcs.push(n);
    toast('认识了 ' + name + '：' + job);
    openCareer();
    saveGame();
  }

  function addChild(s){
    const p = s.player;
    const g = chance(.5) ? '男' : '女';
    const nm = freshName(s, g, p.surname);
    const n = makeNpc({
      name:nm, relation:(g === '男' ? '儿子' : '女儿'), gender:g, age:0,
      job:'在家', income:0, affinity:ri(72,88), inFamily:true, mood:ri(70,92)
    });
    n.birthY = s.year; n.birthM = s.month; n.birthD = ri(1,28);
    n.thought = npcThought(n, s);
    s.npcs.push(n);
    s.family.cash = Math.max(0, r2(s.family.cash - 12));
    p.mood = clamp(p.mood + 8, 0, 100);
    s.history.push({date:s.year + '年' + s.month + '月', event:'添了个' + (g === '男' ? '儿子' : '女儿')});
    toast('孩子出生了：' + nm);
    saveGame();
  }

  function marryPartner(s){
    const p = s.player;
    if(p.married) return;
    const n = s.npcs.find(x => x.name === p.partner);
    p.married = true;
    p.marryYear = s.year;
    s.family.cash = Math.max(0, r2(s.family.cash - 30));
    p.mood = clamp(p.mood + 6, 0, 100);
    if(n){
      n.relation = '配偶';
      n.inFamily = true;
      n.affinity = clamp(n.affinity + 10, 0, 100);
      n.mood = clamp(n.mood + 8, 0, 100);
      n.history.push({d:s.year + '年' + s.month + '月', t:'和你成了亲'});
      n.thought = npcThought(n, s);
    }
    s.history.push({date:s.year + '年' + s.month + '月', event:'成亲'});
    toast('成亲了');
    saveGame();
  }

  function planAction(act, arg){
    const s = gameState, p = s.player;

    if(act === 'oddjob'){
      closeModal();
      const ev = EVENTS.find(e => e.id === 'pocket');
      if(ev) buildStory(ev);
      renderAll();
      return;
    }
    if(act === 'aid'){
      const canScholar = p.age >= 12 && (p.academicScore || 0) >= 70;
      const canAid = s.family.cash < 100;
      closeModal();
      buildAidEvent(s, canScholar, canAid);
      renderAll();
      return;
    }
    if(act === 'job'){
      const jobs = {
        factory:{job:'国棉三厂·正式工', income:32, lv:'一级工'},
        temp:{job:'街道工厂·临时工', income:20, lv:'临时工'},
        apprentice:{job:'机械厂·学徒', income:18, lv:'学徒'},
        teacher:{job:'街道小学·民办教师', income:36, lv:'教师'},
        clinic:{job:'街道卫生所·卫生员', income:30, lv:'卫生员'},
        shop:{job:'供销社·售货员', income:26, lv:'售货员'},
        cook:{job:'国棉三厂·食堂厨师', income:24, lv:'厨师'},
        driver:{job:'运输公司·司机', income:34, lv:'司机'},
        nurse:{job:'市立医院·护士', income:28, lv:'护士'},
        post:{job:'邮电局·邮递员', income:26, lv:'邮递员'},
        clerk:{job:'街道办·干事', income:30, lv:'干事'},
        army:{job:'部队·战士', income:12, lv:'战士'}
      };
      const j = jobs[arg];
      if(!j) return;
      p.job = j.job; p.income = j.income; p.jobLevel = j.lv; p.school = null;
      p.mood = clamp(p.mood + 3, 0, 100);
      toast('上班了：' + j.job);
      renderAll(); saveGame(); openCareer();
      return;
    }

    if(act === 'promote'){
      if(s.turn - p.lastPromoteTurn < 12) return;
      p.lastPromoteTurn = s.turn;
      const levels = ['学徒','临时工','一级工','二级工','三级工','班组长','车间主任'];
      const idx = Math.max(0, levels.indexOf(p.jobLevel));
      const chance = clamp(0.22 + (p.skills['学业'] || 0) / 260 + p.rep / 420, 0.15, 0.85);
      if(Math.random() < chance){
        p.jobLevel = levels[Math.min(levels.length - 1, idx + 1)];
        p.income += 6;
        p.mood = clamp(p.mood + 4, 0, 100);
        toast('晋升了：' + p.jobLevel + ' · 月入 ' + fmtY(p.income));
      }else{
        p.mood = clamp(p.mood - 2, 0, 100);
        p.rep = clamp(p.rep + 0.5, 0, 100);
        toast('这次没轮上，再攒攒表现。');
      }
      renderAll(); saveGame(); openCareer();
      return;
    }

    if(act === 'biz'){
      const biz = {
        repair:{name:'修车摊', cost:25},
        tailor:{name:'裁缝摊', cost:40},
        stall:{name:'小卖部', cost:80}
      }[arg];
      if(!biz || p.money < biz.cost) return;
      p.money -= biz.cost;
      p.business = {name:biz.name, level:1, lastProfit:0};
      toast('开张了：' + biz.name);
      renderAll(); saveGame(); openCareer();
      return;
    }

    if(act === 'bizUp'){
      const cost = p.business.level * 60;
      if(p.money < cost) return;
      p.money -= cost;
      p.business.level += 1;
      toast('生意扩大了一级');
      renderAll(); saveGame(); openCareer();
      return;
    }

    if(act === 'buy'){
      const shop = {
        bike:{name:'自行车', cost:120}, watch:{name:'手表', cost:80},
        radio:{name:'收音机', cost:60}, sewing:{name:'缝纫机', cost:100}
      }[arg];
      if(!shop || p.money < shop.cost || (p.assets || []).indexOf(shop.name) >= 0) return;
      p.money -= shop.cost;
      p.assets = p.assets || [];
      p.assets.push(shop.name);
      p.mood = clamp(p.mood + 3, 0, 100);
      toast('买下了：' + shop.name);
      renderAll(); saveGame(); openCareer();
      return;
    }

    if(act === 'house'){
      if(p.age < 18 || s.family.cash < 800 || s.family.house.owned) return;
      s.family.cash -= 800;
      s.family.house.owned = true;
      s.family.house.rent = 0;
      toast('买下了现住房，不用再交房租');
      renderAll(); saveGame(); openCareer();
      return;
    }

    if(act === 'orient'){
      p.orientation = arg;
      toast('取向已设定：' + arg);
      saveGame(); openCareer();
      return;
    }

    if(act === 'meet'){ meetPerson(); return; }

    if(act === 'approach'){
      if(p.socialMonth === s.turn){ toast('这个月已经走动过了'); return; }
      const n = s.npcs.find(x => x.id === arg);
      if(!n) return;
      p.socialMonth = s.turn;
      n.affinity = clamp(n.affinity + 5, 0, 100);
      p.mood = clamp(p.mood + 1, 0, 100);
      toast('你和' + n.name + '又熟了一点');
      renderAll(); saveGame(); openCareer();
      return;
    }

    if(act === 'distant'){
      if(p.socialMonth === s.turn) return;
      const n = s.npcs.find(x => x.id === arg);
      if(!n) return;
      p.socialMonth = s.turn;
      n.affinity = clamp(n.affinity - 6, 0, 100);
      p.mood = clamp(p.mood - 1, 0, 100);
      toast('你和' + n.name + '疏远了一些');
      renderAll(); saveGame(); openCareer();
      return;
    }

    if(act === 'marry'){
      marryPartner(s);
      openCareer();
      renderAll();
      return;
    }
    if(act === 'partner'){
      const n = s.npcs.find(x => x.id === arg);
      if(!n || n.affinity < 70) return;
      p.partner = n.name;
      n.affinity = clamp(n.affinity + 5, 0, 100);
      p.mood = clamp(p.mood + 5, 0, 100);
      toast('你和' + n.name + '定下了关系');
      renderAll(); saveGame(); openCareer();
    }
  }

  function openLog(){
    const s = gameState;
    let html = '';
    if(!s.monthLog || !s.monthLog.length){
      html += '<div class="empty">本月还没有日常记录。</div>';
    }else{
      let lastDay = null;
      s.monthLog.forEach(e => {
        if(e.day !== lastDay){
          html += '<div class="log-day">' + esc(e.date) + '</div>';
          lastDay = e.day;
        }
        html += '<div class="log-entry">' + esc(e.text) + '</div>';
      });
    }

    html += '<div class="log-day">你的选择</div>';
    if(s.choices && s.choices.length){
      html += s.choices.slice(-8).reverse().map(c =>
        '<div class="log-entry"><b>' + esc(c.date) + '</b> ' + esc(c.text) + '</div>'
      ).join('');
    }else{
      html += '<div class="empty">还没有做出什么选择。</div>';
    }

    openModal('本月履历', s.year + '年' + s.month + '月 · 日常 ' + (s.monthLog ? s.monthLog.length : 0) + ' 条', html);
  }

  function openReset(){
    let hasSnap = false;
    try{ hasSnap = !!localStorage.getItem(SNAPSHOT_KEY); }catch(e){}
    openModal('存档与重开', '先备份，再决定',
      '<div class="plan-note">备份会保存当前这一刻的完整存档。以后读档出错时，系统也会优先恢复进度最高的一份。</div>' +
      '<div class="modal-actions">' +
        '<button class="btn ghost" id="snapSave" type="button">备份当前存档</button>' +
        (hasSnap ? '<button class="btn ghost" id="snapRestore" type="button">恢复快照</button>' : '') +
      '</div>' +
      '<div class="danger-text" style="margin-top:12px">重开会重新生成姓名、性别、家境、城市与家人。<br>现在的档案、人物和履历都会消失。</div>' +
      '<div class="modal-actions">' +
        '<button class="btn ghost" id="cancelReset" type="button">再想想</button>' +
        '<button class="btn danger" id="confirmReset" type="button">重开</button>' +
      '</div>');

    const cancel = $('cancelReset'), confirm = $('confirmReset');
    const snap = $('snapSave'), restore = $('snapRestore');
    if(cancel) cancel.addEventListener('click', closeModal);
    if(confirm) confirm.addEventListener('click', resetGame);
    if(snap) snap.addEventListener('click', () => {
      try{
        const raw = localStorage.getItem(SAVE_KEY);
        if(raw){ localStorage.setItem(SNAPSHOT_KEY, raw); toast('已备份当前存档'); }
        else toast('还没有可备份的存档');
      }catch(e){ toast('备份失败'); }
    });
    if(restore) restore.addEventListener('click', () => {
      try{
        const raw = localStorage.getItem(SNAPSHOT_KEY);
        if(raw){
          localStorage.setItem(SAVE_KEY, raw);
          toast('已恢复快照');
          setTimeout(() => location.reload(), 400);
        }
      }catch(e){}
    });
  }

  function openFamilyPicker(fresh){
    const tip = fresh
      ? '只留两种开局：随缘直接随机出生；自定义自己定姓名、性别、兄姐和父母职业方向。'
      : '换一家会重新开始这一生。只留随缘和自定义两种。';
    const randomCard = '<button class="fcard random" type="button" data-id="random">' +
      '<div class="ftop"><span class="fname">🎲 随缘一家</span><span class="fbadge">全部随机</span></div>' +
      '<div class="fcity">年代、城市、家境、父母职业、兄姐、弟妹、性别、姓名，全部交给骰子。</div>' +
      '<div class="fnote">点一下直接出生，不再问第二遍。</div>' +
    '</button>';
    const customCard = '<button class="fcard random" type="button" data-id="custom">' +
      '<div class="ftop"><span class="fname">✍️ 自定义一生</span><span class="fbadge">自己定</span></div>' +
      '<div class="fcity">自己选性别、姓氏、名字、要不要兄姐、父母职业方向。</div>' +
      '<div class="fnote">点进去设定，再出生。</div>' +
    '</button>';

    openModal(
      fresh ? '开始新的一生' : '换一家',
      fresh ? '随缘或自定义' : '会重新开始这一生',
      '<div class="fpick-tip">' + tip + '</div>' +
      (fresh ? '' : '<div class="fpick-warn">选择后当前人生将被覆盖，且无法恢复。</div>') +
      randomCard + customCard
    );

    $('modalBody').querySelectorAll('.fcard').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        if(id === 'custom'){ openSetup(null); return; }
        if(id === 'random'){
          closeModal();
          newGame(null, {gender:'随缘', surname:'father', given:'', sibs:'random', kids:'auto', fatherDir:'auto', motherDir:'auto'});
          toast('随缘一家，出生了');
          return;
        }
        const preset = FAMILY_PRESETS.find(x => x.id === id);
        if(!preset) return;
        closeModal();
        newGame(preset, {gender:'随缘', surname:'father', given:'', sibs:'preset', kids:'ask', fatherDir:'auto', motherDir:'auto'});
        toast('新家：' + preset.short);
      });
    });
  }

  function openSetup(preset){
    const fSur = preset ? String(preset.father.name).charAt(0) : '';
    const mSur = preset ? String(preset.mother.name).charAt(0) : '';
    const dirOpts = [
      {v:'auto', b:'按原样', s:'不换方向'},
      {v:'random', b:'随机', s:'掷骰决定方向'},
      {v:'从政', b:'从政', s:'机关、妇联、供销社'},
      {v:'从商', b:'从商', s:'商店、会计、经理'},
      {v:'从军', b:'从军', s:'部队、武装部'},
      {v:'从文', b:'从文', s:'教书、编辑、文化馆'},
      {v:'从医', b:'从医', s:'医院、卫生所、药房'},
      {v:'从工', b:'从工', s:'国棉厂、机器厂、铁路'},
      {v:'务农', b:'务农', s:'生产队、大队'},
      {v:'手艺', b:'手艺', s:'木匠、裁缝、修表'}
    ];
    const groups = [
      {key:'gender', title:'你的性别', opts:[
        {v:'随缘', b:'随缘', s:'掷骰决定'},
        {v:'男', b:'男孩', s:'当个小子养'},
        {v:'女', b:'女孩', s:'当个闺女养'}
      ]},
      {key:'surname', title:'你的姓氏', opts:[
        {v:'father', b:'随父姓' + (fSur ? '（' + fSur + '）' : ''), s:'跟着父亲姓'},
        {v:'mother', b:'随母姓' + (mSur ? '（' + mSur + '）' : ''), s:'跟着母亲姓'},
        {v:'custom', b:'自己填', s:'在下面写一个字或复姓'}
      ]},
      {key:'sibs', title:'哥哥姐姐（只管比你大的）', opts:[
        {v:'preset', b:'按这家的原样', s:preset ? '保留这家的孩子安排' : '随缘'},
        {v:'none', b:'一个都不要', s:'没有哥哥姐姐'},
        {v:'one', b:'要一个', s:'性别随缘，比你大几岁'},
        {v:'random', b:'随缘', s:'随机零到两个'}
      ]},
      {key:'kids', title:'之后父母再要孩子（弟弟妹妹）', opts:[
        {v:'ask', b:'先问我', s:'母亲会来问你的意思'},
        {v:'auto', b:'父母自己定', s:'不商量，按他们的性子来'},
        {v:'no', b:'不要了', s:'往后不再添人'}
      ]},
      {key:'fatherDir', title:'父亲职业方向', three:true, opts:dirOpts},
      {key:'motherDir', title:'母亲职业方向', three:true, opts:dirOpts}
    ];
    const sel = {gender:'随缘', surname:'father', customSurname:'', given:'', sibs:'none', kids:'no', fatherDir:'auto', motherDir:'auto'};
    let html = '<div class="fpick-tip">出生前，先定下这几件事。姓氏、名字、兄姐和父母职业都改不了，选好了再往下走。</div>';
    groups.forEach(g => {
      html += '<div class="plan-sec"><div class="plan-title">' + g.title + '</div>' +
        '<div class="plan-grid' + (g.three ? ' three' : '') + '" data-group="' + g.key + '">';
      g.opts.forEach(o => {
        html += '<button class="plan-btn' + (sel[g.key] === o.v ? ' sel' : '') + '" type="button" data-v="' + o.v + '"><b>' + o.b + '</b><span>' + o.s + '</span></button>';
      });
      html += '</div>';
      if(g.key === 'surname'){
        html += '<input class="setup-input" id="setupSurname" maxlength="2" placeholder="自定义姓氏：选了“自己填”才用它">';
      }
      html += '</div>';
      if(g.key === 'surname'){
        html += '<div class="plan-sec"><div class="plan-title">你的名字</div>' +
          '<input class="setup-input" id="setupGiven" maxlength="3" placeholder="自己填名字；留空就随机生成" style="margin-top:0">' +
          '<div class="plan-note" style="margin-top:5px">只填名字，不带姓。姓氏按上面那栏来。</div></div>';
      }
    });
    html += '<div class="setup-sum" id="setupSum">—</div>';
    html += '<div class="modal-actions" style="margin-top:8px"><button class="btn" id="setupStart" type="button">就这样，出生</button></div>';
    openModal('出生之前', (preset ? preset.short : '随缘一家') + ' · 姓名 · 性别 · 父母职业', html);

    $('modalBody').querySelectorAll('.plan-grid').forEach(grid => {
      const key = grid.getAttribute('data-group');
      grid.querySelectorAll('.plan-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          grid.querySelectorAll('.plan-btn').forEach(x => x.classList.remove('sel'));
          btn.classList.add('sel');
          sel[key] = btn.getAttribute('data-v');
        });
      });
    });
    const sIn = $('setupSurname'), gIn = $('setupGiven');
    const updateSum = () => {
      const sur = sel.surname === 'mother' ? (mSur || '母姓') : (sel.surname === 'custom' ? (sel.customSurname || '自填姓') : (fSur || '父姓'));
      const sibTxt = {preset:'按这家原样', none:'无兄姐', one:'一个哥哥或姐姐', random:'兄姐随缘'}[sel.sibs];
      const kidTxt = {ask:'弟妹会先问你', auto:'弟妹由父母定', no:'不再添弟妹'}[sel.kids];
      const gTxt = sel.gender === '随缘' ? '性别随缘' : sel.gender + '孩';
      const sum = $('setupSum');
      if(sum) sum.textContent = '将出生：' + (preset ? preset.short : '随缘一家') + ' · 姓' + sur + ' · ' + gTxt + ' · ' + sibTxt + ' · ' + kidTxt;
    };
    if(sIn) sIn.addEventListener('input', () => { sel.customSurname = sIn.value; updateSum(); });
    if(gIn) gIn.addEventListener('input', () => { sel.given = gIn.value; });
    $('modalBody').querySelectorAll('.plan-btn').forEach(btn => btn.addEventListener('click', updateSum));
    updateSum();

    const start = $('setupStart');
    if(start) start.addEventListener('click', () => {
      if(sel.surname === 'custom' && !/[\u4e00-\u9fa5]/.test(sel.customSurname || '')){
        toast('自定义姓氏请填一到两个字');
        return;
      }
      closeModal();
      newGame(preset, sel);
      toast(preset ? '新家：' + preset.short : '随缘一家，出生了');
    });
  }


  function toast(msg){
    const t = $('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
  }

  function bindUI(){
    $('btnNext').addEventListener('click', advanceMonth);
    $('btnPeople').addEventListener('click', openPeople);
    $('btnAllPeople').addEventListener('click', openPeople);
    const socialBtn = $('btnSocial');
    if(socialBtn) socialBtn.addEventListener('click', openSocial);
    $('btnLog').addEventListener('click', openLog);
    const afterBtn = $('btnAfter');
    if(afterBtn) afterBtn.addEventListener('click', openAfterSchool);
    $('btnFamilyCard').addEventListener('click', openFamily);
    $('btnFamilyDetail').addEventListener('click', openFamily);
    $('btnCareer').addEventListener('click', openCareer);
    $('btnRestart').addEventListener('click', openReset);
    $('btnFamily').addEventListener('click', () => openFamilyPicker(false));
    $('modalClose').addEventListener('click', closeModal);

    $('modal').addEventListener('click', e => {
      if(e.target === $('modal')) closeModal();
    });

    document.addEventListener('keydown', e => {
      if(e.key === 'Escape') closeModal();
    });

    $('peopleList').addEventListener('click', e => {
      const row = e.target.closest ? e.target.closest('.person') : null;
      if(row && row.getAttribute('data-id')) openPerson(row.getAttribute('data-id'));
    });
  }

  function init(){
    bindUI();
    if(!loadGame()){
      newGame();
      openFamilyPicker(true);
    }else{
      updateUI();
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  }else{
    init();
  }

  /* 便于排查与二次开发（不影响游戏） */
  window.NianDaiSim = {
    get state(){ return gameState; },
    get storyData(){ return storyData; },
    get currentStoryId(){ return currentStoryId; },
    advance: advanceMonth,
    choose: handleOptionClick,
    reset: resetGame
  };
})();
</script>
