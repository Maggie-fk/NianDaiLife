<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#223a30">
<meta name="description" content="年代文人生模拟器 · 1950—1970 中国市井人生 · 制作人：云朵">
<title>年代文人生模拟器 · 制作人：云朵</title>
<style>
:root{
  --paper:#f8efdc; --paper-2:#fdf7e9; --ink:#2d2117; --ink-2:#5f4a35; --ink-3:#8a6b47;
  --red:#a63128; --red-2:#c0453a; --green:#2c463a; --gold:#bd9250;
  --line:#d8c09a; --line-2:#e6d3b0;
  --shadow:0 2px 0 rgba(150,110,60,.10),0 7px 16px rgba(80,50,20,.08);
  --font-body:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,SimSun,"Times New Roman",serif;
  --font-title:"Kaiti SC",KaiTi,STKaiti,"Noto Serif CJK SC","Source Han Serif SC","Songti SC",STSong,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:#1b1512;
  background-image:
    radial-gradient(720px 430px at 10% -6%, #5a3a2c 0%, rgba(90,58,44,0) 62%),
    radial-gradient(820px 520px at 96% 106%, #2d4a3d 0%, rgba(45,74,61,0) 60%),
    radial-gradient(620px 420px at 50% 45%, #241b17 0%, #140f0d 100%);
  font-family:var(--font-body);
  color:var(--ink);
  display:flex;justify-content:center;align-items:stretch;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}

.app{
  position:relative;display:flex;flex-direction:column;
  width:100%;max-width:430px;height:100vh;height:100dvh;
  background:
    linear-gradient(180deg,#fbf3e2 0%,#f6ead3 46%,#f2e3c7 100%);
  overflow:hidden;
  box-shadow:0 0 70px rgba(0,0,0,.6);
}
.app::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background:
    repeating-linear-gradient(0deg,rgba(140,100,50,.028) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(90deg,rgba(140,100,50,.018) 0 1px,transparent 1px 7px);
}
@media (min-width:520px){
  body{padding:20px 0}
  .app{height:min(920px,calc(100dvh - 40px));border-radius:26px;border:1px solid #0d0907}
}

/* ============ 报头 ============ */
.masthead{
  position:relative;flex:0 0 auto;z-index:3;
  padding:14px 16px 34px;
  color:#f5e5c0;overflow:hidden;
  background:
    radial-gradient(150px 90px at 84% 8%, rgba(230,180,110,.22), rgba(230,180,110,0) 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 2px, transparent 2px 6px),
    linear-gradient(155deg,#345344 0%,#223a30 56%,#192c24 100%);
  border-bottom:2px solid #b98f4e;
  box-shadow:0 3px 0 rgba(60,40,20,.18);
}
.masthead::before{
  content:"";position:absolute;right:60px;top:-26px;width:86px;height:86px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,200,130,.30),rgba(240,200,130,0) 68%);
}
.masthead::after{
  content:"";position:absolute;left:16px;right:16px;top:8px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(220,185,125,.55),transparent);
}
.eyebrow{
  font-size:8.5px;letter-spacing:4.5px;color:#c9ad7c;opacity:.75;
  display:flex;align-items:center;gap:7px;margin-bottom:7px;
}
.eyebrow::before{content:"";width:14px;height:1px;background:#c9ad7c;opacity:.7}
h1{
  position:relative;z-index:1;
  font-family:var(--font-title);
  font-size:23px;line-height:1.25;letter-spacing:2px;font-weight:700;
  color:#f7e7c3;
  text-shadow:0 1px 0 rgba(0,0,0,.55),0 0 18px rgba(235,195,125,.22);
}
.maker{
  position:relative;z-index:1;margin-top:5px;
  font-size:10.5px;letter-spacing:3px;color:#dcc08c;
}
.maker b{font-weight:400;color:#f0d6a4}
.seal{
  position:absolute;right:16px;top:16px;z-index:2;
  width:37px;height:37px;display:grid;place-items:center;
  border:2px solid rgba(214,100,84,.85);border-radius:4px;
  color:#e18d78;font-family:var(--font-title);font-size:16px;line-height:1;
  background:rgba(126,40,30,.16);
  transform:rotate(-6deg);
  box-shadow:inset 0 0 0 1px rgba(214,100,84,.25);
  opacity:.92;
}
.skyline{
  position:absolute;left:0;right:0;bottom:-1px;width:100%;height:36px;
  opacity:.5;pointer-events:none;
}

/* ============ 日期条 ============ */
.datebar{
  position:relative;z-index:2;flex:0 0 auto;
  display:flex;align-items:center;gap:9px;
  padding:8px 14px;
  background:linear-gradient(180deg,#f4e3c4,#ecd8b4);
  border-bottom:1px solid #cbb083;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 6px rgba(100,70,30,.06);
}
.date-main{font-size:15px;font-weight:700;letter-spacing:1px;color:#4a3524;font-feature-settings:"tnum"}
.date-sub{
  font-size:9.5px;color:#8a6b47;letter-spacing:.4px;
  padding-left:9px;border-left:1px solid #c6a878;line-height:1.5;
}
.season-seal{
  margin-left:auto;flex:0 0 auto;
  width:26px;height:26px;display:grid;place-items:center;
  background:linear-gradient(180deg,#b23b31,#8e2a22);
  color:#ffe6bd;font-family:var(--font-title);font-size:13px;border-radius:3px;
  box-shadow:0 1px 0 #611a14,inset 0 0 0 1px rgba(255,230,200,.22);
}

/* ============ 滚动区 ============ */
.content{
  position:relative;z-index:1;flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;
  padding:12px 12px 96px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#storyCard{order:-1}
.content::-webkit-scrollbar{width:0;height:0}

/* ============ 卡片 ============ */
.card{
  position:relative;
  background:linear-gradient(180deg,#fffcf3 0%,#fbf1dc 100%);
  border:1px solid var(--line);border-radius:10px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);
}
.card::before{
  content:"";position:absolute;inset:4px;border:1px solid rgba(190,158,110,.26);
  border-radius:6px;pointer-events:none;
}
.sec-title{
  display:flex;align-items:baseline;gap:7px;
  font-size:12.5px;font-weight:700;letter-spacing:2.5px;color:var(--red);
  position:relative;padding-left:10px;margin-bottom:10px;
}
.sec-title::before{
  content:"";position:absolute;left:0;top:1px;width:3px;height:13px;
  background:var(--red);box-shadow:2px 0 0 rgba(166,49,40,.22);
}
.sec-title .en{
  font-size:7.5px;letter-spacing:1.6px;color:#b0936c;font-weight:400;font-family:Georgia,serif;
}
.sec-title .extra{margin-left:auto;font-size:9.5px;letter-spacing:.5px;color:#96754f;font-weight:400}

/* ============ 人生档案 ============ */
.profile-top{display:flex;gap:10px;align-items:center}
.avatar{
  flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,#c9564a,#8f2a22 72%);
  color:#ffe9c9;font-family:var(--font-title);font-size:23px;
  border:1px solid #6e1f19;
  box-shadow:0 2px 0 rgba(90,30,20,.28),inset 0 0 0 2px rgba(255,230,200,.22);
}
.p-main{min-width:0;flex:1 1 auto}
.p-name{display:flex;align-items:baseline;gap:6px;font-size:17px;font-weight:700;letter-spacing:1px;color:#33261a}
.p-age{
  font-size:10px;font-weight:400;color:#f6e5c2;background:var(--green);
  padding:1px 5px;border-radius:2px;letter-spacing:.5px;
}
.p-sub{font-size:10px;color:#8a6b47;margin-top:3px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{
  font-size:9px;color:#7a5836;border:1px solid #d8bb8c;background:#fdf5e2;
  padding:1px 6px;border-radius:20px;letter-spacing:.3px;
}
.p-desc{
  font-size:11.5px;line-height:1.8;color:#5f4a35;text-align:justify;
  margin:9px 0 10px;letter-spacing:.15px;
}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.stat{
  display:flex;align-items:baseline;justify-content:space-between;gap:2px;
  background:rgba(240,222,185,.55);border:1px solid rgba(197,167,120,.55);
  border-radius:6px;padding:5px 6px;
}
.stat span{font-size:9.5px;color:#80633f;letter-spacing:.5px}
.stat b{font-size:12.5px;color:#3b2c1d;font-weight:700;font-feature-settings:"tnum"}
.meters{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.meter{display:flex;align-items:center;gap:7px;font-size:9.5px;color:#80633f}
.meter .mlabel{flex:0 0 auto;letter-spacing:.5px}
.meter .bar{
  flex:1 1 auto;height:6px;border-radius:4px;overflow:hidden;
  background:#e8d6b5;border:1px solid #d6bd93;
}
.meter .bar i{display:block;height:100%;border-radius:3px;transition:width .45s ease}
.meter.hp .bar i{background:linear-gradient(90deg,#9c2f27,#d06a4f)}
.meter.mood .bar i{background:linear-gradient(90deg,#3c614f,#7fa07a)}
.meter b{flex:0 0 auto;min-width:62px;text-align:right;font-size:9.5px;font-weight:400;color:#5d4730}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:0 0 8px}
.money div{
  background:#f3e4c8;border:1px dashed #d3b486;border-radius:5px;
  padding:4px 2px;text-align:center;min-width:0;
}
.money em{display:block;font-style:normal;font-size:8.5px;color:#8a6b47;letter-spacing:.3px;margin-bottom:1px}
.money b{font-size:11.5px;color:#3b2c1d;font-weight:700;font-feature-settings:"tnum";white-space:nowrap}
.asset-line{
  font-size:10px;color:#6b5138;line-height:1.75;
  border-top:1px dotted #d9c3a0;padding-top:7px;letter-spacing:.2px;
}
.asset-line b{color:#4a3524;font-weight:700}
.eco-line{font-size:9px;color:#96754f;margin-top:4px;letter-spacing:.2px}

/* ============ 个人 / 家庭 ============ */
.personal-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:0 0 10px}
.personal-bar div{
  display:flex;flex-direction:column;gap:1px;min-width:0;
  background:#f3e4c8;border:1px solid #dcc49c;border-radius:6px;padding:5px 6px;
}
.personal-bar em{font-style:normal;font-size:8px;color:#8a6b47;white-space:nowrap}
.personal-bar b{font-size:12px;color:#3b2c1d;font-feature-settings:"tnum";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fam-summary{font-size:9.8px;line-height:1.7;color:#6b5138;margin-bottom:7px}
.fam-summary b{color:#3b2c1d}
.fam-members{display:flex;flex-direction:column;gap:1px;margin-bottom:8px}
.fam-row{
  display:flex;align-items:baseline;gap:6px;padding:3px 0;
  border-bottom:1px dotted rgba(214,189,147,.65);font-size:9.5px;color:#5f4a35;
}
.fam-row:last-child{border-bottom:0}
.fam-row .fr-rel{flex:0 0 32px;color:#96754f}
.fam-row .fr-name{flex:0 0 auto;font-weight:700;color:#3b2c1d;white-space:nowrap}
.fam-row .fr-name i{font-style:normal;font-size:8px;color:#96754f;margin-left:2px;font-weight:400}
.fam-row .fr-job{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#7c6141}
.fam-row .fr-inc{flex:0 0 auto;color:#8a6b47;font-feature-settings:"tnum"}

/* ============ 剧情 ============ */
.story-card{padding:15px 14px 14px;background:linear-gradient(180deg,#fffdf7 0%,#faf0da 100%)}
.story-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.story-top .sec-title{margin-bottom:0}
.pill{
  flex:0 0 auto;font-size:9px;letter-spacing:1px;color:#fff3dc;
  background:linear-gradient(180deg,#b23b31,#8f2a22);
  padding:3px 8px;border-radius:2px;border:1px solid #7a241d;
  box-shadow:inset 0 1px 0 rgba(255,220,180,.25);
}
.story-title{
  font-family:var(--font-title);font-size:16.5px;line-height:1.5;letter-spacing:.8px;
  color:#33261a;margin:2px 0 3px;font-weight:700;
}
.story-meta{font-size:9.5px;color:#96754f;letter-spacing:.4px;margin-bottom:9px}
.story-body{
  font-size:13px;line-height:1.95;color:#3d2e20;text-align:justify;letter-spacing:.2px;
  border-top:1px solid rgba(200,170,120,.4);padding-top:10px;
  word-break:break-word;
}
.story-body .em{color:#a63128;font-weight:700}
.delta-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.dchip{
  font-size:9px;padding:2px 7px;border-radius:20px;
  background:#efe0c0;border:1px solid #dcc49c;color:#6b4f30;letter-spacing:.2px;
}
.dchip.good{background:#e5efe2;border-color:#b8cfb4;color:#3f5f45}
.dchip.bad{background:#f6e0dc;border-color:#e3b6ae;color:#8e3a30}
.options{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{
  display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;
  background:linear-gradient(180deg,#fff8e8,#f6e8cb);
  border:1px dashed #c8a46a;border-radius:8px;padding:10px 11px;
  color:var(--ink);cursor:pointer;position:relative;
  transition:transform .14s ease,background .14s ease,box-shadow .14s ease;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
}
.opt:active{transform:scale(.985);background:linear-gradient(180deg,#f8ecd4,#f0ddb9)}
.opt .mark{flex:0 0 auto;color:var(--red);font-size:11px;line-height:1.7;opacity:.85}
.opt .otext{min-width:0;flex:1 1 auto}
.opt .ot{font-size:13px;line-height:1.55;font-weight:700;color:#3b2c1d;letter-spacing:.2px}
.opt .oh{display:block;font-size:9.5px;color:#8a6b47;margin-top:2px;letter-spacing:.2px}
.story-hint{
  margin-top:10px;text-align:center;font-size:9.5px;color:#96754f;letter-spacing:.5px;
}
.story-hint::before{content:"· ";color:#b0936c}
.story-hint::after{content:" ·";color:#b0936c}

/* ============ 人物 ============ */
.person{
  display:flex;align-items:center;gap:9px;padding:7px 2px 8px;
  border-bottom:1px dashed rgba(205,178,135,.55);cursor:pointer;transition:background .15s;
}
.person:last-child{border-bottom:0;padding-bottom:2px}
.person:active{background:rgba(240,222,185,.35)}
.pinfo{min-width:0;flex:1 1 auto}
.pav{
  flex:0 0 auto;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#f3e3c4,#e7d0a8);
  border:1px solid #cbb083;color:#7a3a2c;font-family:var(--font-title);font-size:16px;
}
.pn{font-size:12.5px;color:#3b2c1d;font-weight:700;letter-spacing:.3px}
.pn i{font-style:normal;font-size:9px;color:#96754f;font-weight:400;margin-left:4px}
.pj{font-size:9px;color:#8a6b47;margin-top:1px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmood{margin-left:auto;flex:0 0 auto;text-align:right}
.pmood .face{font-size:12px}
.pmood .aff{width:48px;height:3px;background:#e6d3b0;border-radius:2px;margin-top:3px;overflow:hidden}
.pmood .aff i{display:block;height:100%;background:linear-gradient(90deg,#a63128,#cf7a58)}
.more-link{
  display:block;margin:7px 0 0 auto;font-size:9.5px;color:#96754f;letter-spacing:.3px;
  background:none;border:0;cursor:pointer;padding:2px 0;
}
.more-link::after{content:" ›"}

/* ============ 见闻 ============ */
.gossip-item{
  font-size:10.5px;line-height:1.75;color:#584431;padding:6px 0;
  border-bottom:1px dotted #decaa6;letter-spacing:.15px;
}
.gossip-item:last-of-type{border-bottom:0}
.gossip-item .gd{color:#a63128;font-weight:700;margin-right:4px}
.gossip-item .who{color:#7a3a2c}

/* ============ 底栏 ============ */
.bottombar{
  position:absolute;z-index:30;left:0;right:0;bottom:0;
  display:flex;align-items:center;gap:7px;
  padding:9px 11px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(249,238,217,.94),#f1dfc0);
  border-top:1px solid #d3b68b;
  box-shadow:0 -7px 20px rgba(80,50,20,.10);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.btn{
  appearance:none;border:0;cursor:pointer;border-radius:8px;
  padding:10px;font-size:11.5px;letter-spacing:1px;white-space:nowrap;
  transition:transform .14s ease,filter .14s ease;
}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.ghost{
  background:#fdf7e9;border:1px solid #d2b78c;color:#6d5132;
  box-shadow:0 1px 0 rgba(255,255,255,.85) inset,0 1px 0 rgba(150,110,60,.12);
}
.btn.primary{
  flex:1 1 auto;min-width:0;
  background:linear-gradient(180deg,#b23b31,#8e2a22);
  color:#ffe9c8;border:1px solid #6f1d17;
  box-shadow:0 2px 0 #611a14,0 4px 12px rgba(120,30,20,.24),inset 0 1px 0 rgba(255,220,190,.32);
  font-weight:700;font-size:12.5px;letter-spacing:2.5px;padding:11px 8px;
}
.btn.primary:disabled{
  background:linear-gradient(180deg,#cbb79a,#c0ab8d);
  border-color:#b19a7c;color:#f7eddc;box-shadow:none;cursor:default;opacity:.75;
}
.btn.icon{width:41px;padding:10px 0;font-size:14px;line-height:1.2}
.btn.sub{width:52px;padding:10px 0;font-size:11px}

/* ============ 家世选择 ============ */
.tag.eq{color:#3f5f45;border-color:#b8cfb4;background:#eef5ea}
.fpick-tip{font-size:9.5px;color:#8a6b47;line-height:1.7;margin:0 0 10px;text-align:center}
.fcard{
  -webkit-appearance:none;appearance:none;
  display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:linear-gradient(180deg,#fffdf6,#f8ecd5);
  border:1px solid #d8c09a;border-left:3px solid #a63128;border-radius:9px;
  padding:10px 12px;margin:0 0 9px;
  box-shadow:0 1px 0 rgba(255,255,255,.85) inset,0 1px 0 rgba(150,110,60,.1);
  transition:transform .14s ease,background .14s ease;
}
.fcard:active{transform:scale(.99);background:linear-gradient(180deg,#f9efd9,#f2e1c2)}
.fcard.eq{border-left-color:#3f6b52}
.fcard.random{border-left-color:#bd9250;border-style:dashed}
.fcard .ftop{display:flex;align-items:baseline;gap:6px}
.fcard .fname{font-family:var(--font-title);font-size:15px;font-weight:700;color:#33261a;letter-spacing:.5px}
.fcard .fbadge{
  margin-left:auto;font-size:8.5px;color:#7a3a2c;border:1px solid #d9b8a8;
  background:#f8e6dc;padding:1px 5px;border-radius:20px;white-space:nowrap;
}
.fcard .fcity{font-size:9px;color:#96754f;margin:2px 0 5px;letter-spacing:.3px}
.fcard .frow{font-size:9.8px;color:#5f4a35;line-height:1.65}
.fcard .frow b{font-weight:700;color:#3b2c1d}
.fcard .fnote{
  font-size:9.6px;line-height:1.65;color:#7a5836;background:#f4e6c9;
  border-radius:4px;padding:5px 7px;margin-top:6px;
}
.fpick-warn{
  font-size:9.5px;line-height:1.7;color:#8e3a30;background:#f6e0dc;border:1px solid #e3b6ae;
  border-radius:5px;padding:6px 8px;margin:0 0 10px;text-align:center;
}

/* ============ 入学考试 ============ */
.quiz-progress{font-size:9px;color:#96754f;letter-spacing:1px;text-align:center;margin-bottom:8px}
.quiz-q{font-size:13px;line-height:1.8;color:#33261a;font-weight:700;text-align:center;margin:4px 0 12px}
.quiz-opts{display:flex;flex-direction:column;gap:7px}
.quiz-opt{
  width:100%;text-align:left;font:inherit;color:#3b2c1d;cursor:pointer;
  background:linear-gradient(180deg,#fff8e8,#f6e8cb);border:1px dashed #c8a46a;border-radius:8px;
  padding:10px 12px;font-size:12.5px;
}
.quiz-opt:active{background:#f2e0bb}
.quiz-note{font-size:9.5px;color:#8a6b47;text-align:center;line-height:1.7;margin-top:10px}

/* ============ 人生规划 ============ */

  function famNpc(s, rel){
    return s.npcs.find(n => n.relation === rel) || null;
  }

  function siblingsOf(s){
    return s.npcs.filter(n => ['哥哥','姐姐','弟弟','妹妹'].indexOf(n.relation) >= 0);
  }
  function youngerOf(s){
    return s.npcs.filter(n => n.relation === '弟弟' || n.relation === '妹妹');
  }
  function olderOf(s){
    return s.npcs.filter(n => n.relation === '哥哥' || n.relation === '姐姐');
  }
  function namesOf(list){
    return list.map(n => n.name).join('、');
  }
  function ensureTeacher(s){
    if(s.npcs.some(n => n.relation === '老师')) return;
    s.npcs.push(makeNpc({
      name:'陈老师', relation:'老师', gender:'女', age:ri(26,42),

      affinity:35, inFamily:false, mood:ri(58,80)

    const f = famNpc(s, '父亲');

  }

  function buddyName(s){
    const n = s.npcs.find(x => x.relation === '玩伴' && x.alive !== false);
    return n ? n.name : '院里的孩子';

  function ageAppropriateJob(job, age){
    if(age >= 35) return job;
    const cap = age < 28 ? 1 : 2;
    if(jobRank(job) <= cap) return job;
    const map = [
      [/主任/, '科员'], [/参谋/, '干事'], [/连长/, '排长'], [/院长/, '医生'],
      [/校长/, '教师'], [/主治/, '住院医师'], [/工程师/, '技术员'], [/书记/, '科员'],
      [/经理/, '店员'], [/营长/, '连长'], [/团长/, '营长'], [/处长/, '科长']
    ];
    for(let i = 0; i < map.length; i++){
      if(map[i][0].test(job)) return job.replace(map[i][0], map[i][1]);
    }
    return job;
  }

  function monthlyEconomy(){
    const s = gameState, f = s.family, p = s.player;
    const fam = s.npcs.filter(n => n.inFamily && n.alive);
    const size = fam.length + 1;
    let income = fam.reduce((a,n) => a + (n.income || 0), 0);

    const food = size * f.cls.foodPer;
    const rent = f.house.owned ? 0 : f.house.rent;
    const winter = (s.month >= 11 || s.month <= 2);
    const utility = 1.4 + (winter ? 1.5 : 0.5);
    const misc = (f.cls.name === '农民' ? rand(2.2, 4.6) : rand(3.2, 7.2)) + income * 0.03;
    let annual = 0;
    if(s.month === 9) annual = size * 1.2 + 3;
    if(s.month === 2) annual = size * 1.3 + 2;
    if(s.month === 12) annual = size * 2 + 4;
    const expense = food + rent + utility + misc + (f.cls.extra || 0) + annual;

    let grainCost = 0;
    if(f.cls.name === '农民'){
      income += ri(4,8);
      f.grain += size * 8;
      if(s.month === 10) f.grain += size * 55;
      f.grain = Math.min(f.grain, 680);
    }else{
      f.ration = Math.min(f.ration + size * 14.2, 420);
      const buy = Math.min(f.ration, size * 14, 520 - f.grain);
      f.ration -= buy;
      f.cash -= buy * 0.11;
      grainCost += buy * 0.11;
      f.grain += buy;
    }

    if(f.cls.name !== '农民') income += ri(2,6);
    f.cash += income - expense;
    f.last.income = r1(income);

    let need = size * (f.cls.name === '农民' ? 12 : 13.5);
    if(f.grain > 0){
      const use = Math.min(f.grain, need);
      f.grain -= use; need -= use;
    }
    if(need > 0){
      const use = Math.min(f.ration, need);
      f.ration -= use; need -= use;
      grainCost += use * 0.12;
      f.cash -= use * 0.12;
    }
    if(need > 0){
      f.cash -= need * 0.3;
      grainCost += need * 0.3;
      p.mood -= 1.5;
      s.flags.hungry = true;
    }

    if(winter){
      f.coal -= size * 9;
      if(f.coal < 0){
        f.coal = 60;
        f.cash -= 2.4;
        grainCost += 2.4;
      }
      f.coal = Math.min(f.coal, 600);
    }

    let major = 0;
    if(s.month === 12){
      if(f.cash > 300) major = Math.min(r1(f.cash * 0.3), 260);
      else if(f.cash > 120) major = ri(20,60);
      f.cash -= major;
    }
    f.last.expense = r1(expense + grainCost + major);
    if(f.cash < 0){
      p.mood -= 2;
      f.debt = (f.debt || 0) - f.cash;
      f.cash = 0;
      s.flags.inDebt = true;
    }

    if(p.mood < 25) p.health -= 1;
    if(p.health < 38 && chance(.35)) p.health -= 1.5;
    if(p.mood > 68 && p.health < 95) p.health += 0.8;
    p.mood = clamp(p.mood + (chance(.5) ? 1 : -1), 0, 100);
    p.health = clamp(p.health, 3, 100);

    if(p.job && p.income) p.money += p.income;
    if(p.business){
      const profit = p.business.level * 4 + ri(2, 8) - (chance(.15) ? ri(3, 10) : 0);
      p.money += profit;
      p.business.lastProfit = profit;
      if(profit < 0) p.mood = clamp(p.mood - 1, 0, 100);
    }
    p.money = r2(Math.max(0, p.money));

    return {income, expense:f.last.expense, size};
  }

  function monthlyGrowth(){
    // 学业成绩按月根据考试记录和学业技能重算
    const p = gameState.player;
    const schoolMul = p.schoolTier === '重点' ? 1.3 : (p.schoolTier === '普通' ? 1 : 0.7);
    if(p.age >= 7 && p.age <= 12){
      p.skills['学业'] = clamp((p.skills['学业'] || 0) + 0.3 * schoolMul, 0, 100);
    }else if(p.age >= 13 && p.age <= 15){
      p.skills['学业'] = clamp((p.skills['学业'] || 0) + 0.25, 0, 100);
    }else if(p.age >= 16){
      p.skills['见闻'] = clamp(p.skills['见闻'] + 0.12, 0, 100);
      p.skills['手艺'] = clamp(p.skills['手艺'] + 0.08, 0, 100);
    }
    if(p.age <= 12 && chance(.35)) p.skills['人缘'] = clamp(p.skills['人缘'] + 0.15, 0, 100);
  }

  function addHistory(n, date, text, withName){
    if(!n) return;
    n.history.unshift({d:date, t:text, with:withName});
    if(n.history.length > 600) n.history.length = 600;
  }

  function npcDailyLife(){
    const s = gameState;
    const npcs = s.npcs.filter(n => n.alive);
    const log = [];
    const gossip = [];

    for(let i=0;i<18;i++){
      const a = pick(npcs);
      const b = pick(npcs.filter(n => n.id !== a.id));
      const day = ri(1,28);
      const date = s.month + '月' + day + '日';
      const act = pick(ACTS);

      addHistory(a, date, '与' + b.name + act.t + '。', b.name);
      addHistory(b, date, '与' + a.name + act.t + '。', a.name);

      log.push({day:day, date:date, a:a.name, b:b.name, text:a.name + '与' + b.name + act.t + '。'});

      if(chance(.24)){
        gossip.push({
          date:date,
          text:a.name + '与' + b.name + act.g + '，' + pick(GOSSIP_TAIL) + '。'
        });
      }
    }

    log.sort((x,y) => x.day - y.day);
    s.monthLog = log;
    const gs = gossip.slice(-3);
    if(gs.length) s.gossip = gs.concat(s.gossip).slice(0, 18);

    s.npcs.forEach(n => {
      n.mood = clamp(n.mood + ri(-4,4), 12, 96);
      if(n.affinity >= 80) n.mood = clamp(n.mood + 1, 0, 100);
      if(n.mood < 30) n.mood = clamp(n.mood + 2, 0, 100);
      n.thought = npcThought(n, s);
    });
  }

      text:s => `巷口的老周支了个小人书摊，一块木板，几排连环画，看一本一分钱。\n《三国演义》《林海雪原》《鸡毛信》，封皮都翻得起了毛边。几个孩子蹲在摊前，一看就是一下午。\n你摸了摸口袋，里头只有两分钱。`,

      text:s => `腊月里，家家户户都在忙。父亲把攒了一年的白面拿出来，母亲在案板前调馅，两个人一个擀皮一个包，邻居家的肉香顺着墙头飘过来。\n供销社门口排了长队，凭票买糖、买瓜子、买一小块带皮的猪肉。\n你被派去贴春联，浆糊冻得有点稠。`,
      options:s => [
        {t:'跟着父亲挨家挨户拜年', hint:'私房钱 ↑ · 人缘 ↑ · 心情 ↑', eff:{'私房钱':0.2,'人缘':1.5,'心情':4},
          r:s => `你跟在父亲身后，嘴比平时甜，叔叔婶婶叫了一圈，兜里被塞了几颗糖和两枚硬币。\n回家路上父亲说：“嘴甜是好事，别光嘴上甜。”`},
        {t:'留在家里帮着包饺子', hint:'手艺 ↑ · 心情 ↑ · 好感 ↑', eff:{'手艺':1,'心情':3,'好感':2},
          r:s => `你包的饺子歪歪扭扭，下锅就破了两个。母亲笑着说，破的好，年年有余。\n那顿饺子是白菜猪油渣馅的，你吃了两大碗。`},
        {t:'自告奋勇写春联', hint:'识字 ↑ · 口碑 ↑ · 心情 ↑', eff:{'识字':1,'口碑':1,'心情':3},
          r:s => `你趴在桌上写“向阳门第春常在”，字写得一边大一边小。父亲看了半天，还是把它贴了出去。\n路过的邻居念了一遍，说：“这字有劲。”你躲在门后偷偷乐。`}
      ]
    },
    {
      id:'sick', tag:'家中琐事', w:8,

      title:'你病了',
      text:s => `半夜里你开始发烧，浑身发烫，嗓子像塞了一团棉花。母亲把手贴在你额头上，惊得坐了起来。\n父亲披衣下床，在抽屉里翻出半片退烧药。窗外的天还是黑的。\n“去卫生所看看吧。”母亲说。父亲没吭声，开始穿鞋。`,
      options:s => [
        {t:'让父亲背着去卫生所', hint:'健康 ↑ · 家庭存款 −', eff:{'健康':9,'家庭存款':-0.9,'心情':2},
          r:s => `父亲背着你走了两里地。卫生所的值班医生给你打了一针，又包了几片白药片。\n回来的路上天蒙蒙亮，你趴在他背上，听见他喘得很重。`},
        {t:'喝碗姜汤，捂着被子硬扛', hint:'健康 − · 胆量 ↑ · 省钱', eff:{'健康':-4,'胆量':0.8,'心情':-2},
          r:s => `母亲熬了一碗姜汤，辣得你直咧嘴。你捂在被子里出了一身汗，第二天烧退了些，人却虚得厉害。\n父亲说：“下回别硬扛。”`},
        {t:'让母亲去邻居家借点药', hint:'健康 ↑ · 好感 ↑ · 家庭存款 −', eff:{'健康':6,'好感':2,'家庭存款':-0.4},
          r:s => `母亲半夜敲开王婶家的门，借回来两片药和一小块红糖。\n第二天王婶还来看你，带了一碗小米粥。母亲把这份人情记在了心里。`}

    },

      text:s => `为了一只滚进沟里的铁环，${buddyName(s)}和隔壁院的二柱子扭打在一起，两个人滚了一身土。\n围观的孩子起着哄，有人喊“打他”，也有人往后躲。\n你站在人群边上，手里还攥着半块窝头。`,

          r:s => `你拽住${buddyName(s)}的胳膊，又去推二柱子的肩膀，嗓子都喊哑了。\n大人们赶来时，两个人已经松了手。${buddyName(s)}家里后来逢人就说，这孩子懂事。`},

    {
      id:'radio', tag:'时代见闻', w:5,
      when:s => s.player.age >= 6,
      title:'巷口的广播喇叭',
      text:s => `巷口的大喇叭每天早中晚各响一次，先是一段乐曲，然后是播音员不紧不慢的声音。\n母亲下班回来，把当天的报纸摊在桌上，说广播里那条消息，她单位下午已经学过了。父亲在灶间热饭，隔着门问了一句。\n你听不懂那些大道理，只觉得播音员的普通话很好听。`,
      options:s => [
        {t:'蹲在喇叭底下听完整段', hint:'见闻 ↑ · 识字 ↑', eff:{'见闻':1.2,'识字':0.6,'心情':2},
          r:s => `你蹲在墙根下听完了整段广播，学会了一个新词，回家写在本子上问母亲。\n母亲放下手里的材料，先纠正了你的读音，又用你能听懂的话讲了一遍。她说，不懂就问，别装懂。`},
        {t:'把听到的意思讲给母亲听', hint:'见闻 ↑ · 好感 ↑ · 心情 ↑', eff:{'见闻':1,'好感':2,'心情':2}, affRel:'母亲',
          r:s => `你把广播里的意思复述了一遍，说错了两处。母亲没有笑你，拿过报纸，一行一行指给你看。\n那天你记住了：字要一个一个认，事要一件一件弄明白。`},
        {t:'跟父亲说，听听他的看法', hint:'见闻 ↑ · 好感 ↑ · 心情 ↑', eff:{'见闻':1,'好感':2,'心情':2}, affRel:'父亲',
          r:s => `晚饭时你把广播里的话学给父亲听，父亲补充了两句，又说：“你妈单位下午就讨论过了，你问她去。”\n你扭头看母亲，她正低头改材料，嘴角有点笑意。`}
      ]
    },
    {
      id:'ice', tag:'巷口见闻', w:4,
      when:s => (s.month === 7 || s.month === 8) && s.player.age >= 8 && s.player.age <= 14,
      title:'冰棍箱',
      text:s => `三伏天，街口有人推着自行车卖冰棍，后座上绑着一只白木箱，盖着厚棉被。\n三分钱一根，赤豆的、奶油的。你站在树荫底下看了很久，卖冰棍的老头问：“小孩，买不买？”\n你忽然想，要是自己也能批一箱来卖呢。`,
      options:s => [
        {t:'跟母亲商量，批一箱去卖', hint:'私房钱 ↑ · 胆量 ↑ · 人缘 ↑', eff:{'私房钱':0.6,'胆量':1.5,'人缘':1,'心情':4},
          r:s => `母亲犹豫了半天，还是从抽屉里数了钱给你。你借了邻居家的木箱，垫上棉被，在巷口蹲了一下午。\n化了两根，赔了点，可到底挣了几毛钱。你把钱交给母亲，她抽了两分给你。`},
        {t:'买一根，犒劳自己', hint:'心情 ↑ · 私房钱 −', eff:{'心情':4,'私房钱':-0.03},
          r:s => `你选了赤豆的，咬第一口时，凉气从牙根一直窜到眉心。\n舍不得一口吃完，舔了半天，最后化在手里，黏糊糊的。`},
        {t:'帮家里算账、跑腿', hint:'好感 ↑ · 算术 ↑ · 心情 ↑', eff:{'好感':2,'算术':0.6,'心情':1}, affRel:'母亲',
          r:s => `你帮母亲把一沓票据按日期理好，又把找零的钱数了两遍。\n她看了一眼，说：“算得比我还快。”你心里美滋滋的。`}
      ]
    },

        {t:'看个热闹就跑了', hint:'心情 ↑ · 见闻 ↑', eff:{'心情':1,'见闻':0.5},

      text:s => `班主任陈老师来家访，父亲从邻居家借来两把椅子，母亲把桌上的材料收进抽屉，又用抹布把桌面擦了一遍。\n老师坐在堂屋里，说你上课爱走神，可问的问题常常让全班安静下来。\n你躲在门后，耳朵贴着门缝。`,
      options:s => [

          r:s => `你端了一碗白开水，双手递给老师。她接过去，笑着摸了摸你的头。\n送走老师后，母亲说：“老师夸你脑子活，就是坐不住。”你嘿嘿笑。`},

      text:s => `奶奶过生日，父亲擀了长寿面，母亲炒了两个菜，还卧了一个荷包蛋。\n奶奶坐在炕头，头发梳得整整齐齐，见了谁都笑。你想起自己口袋里还有几毛钱。\n院里飘着面香，${youngerOf(s).length ? namesOf(youngerOf(s)) + '已经在桌边坐不住了' : '你已经在桌边坐不住了'}。`,

      title:'厂门口贴出招工简章',
      text:s => `厂门口贴出招工简章，红纸黑字，围了一圈人。招学徒工，年满十六，初中文化，身体健康。\n父亲说，进厂就是端上了铁饭碗，可也得看你能不能吃那份苦。\n你站在人群后头，把简章上的字看了一遍又一遍。`,

      text:s => `街道的干部挨家挨户来做工作，说年轻人到农村去，也是广阔的天地，大有可为。\n母亲把户口本翻来覆去看了好几遍，没说话。父亲蹲在门口抽烟，烟头一明一暗。\n名单上已经有几个熟悉的名字了。`,
      options:s => [

      text:s => `期中考完，你打开铅笔盒，发现里头夹着一张折成四折的纸条。\n字写得很小，很认真：“放学后，能在巷口等我一会儿吗？”没有署名，可你认得那笔迹。\n你的耳朵一下子烧了起来，赶紧把纸条塞回口袋。`,

        {t:'装作没看见，把纸条夹回书里', hint:'心情 − · 识字 ↑', eff:{'心情':-2,'识字':0.5},
          r:s => `你把纸条夹进了语文课本，后来每次翻到那一页，都会停一下。\n很多年后整理旧书，那张纸条还在，字迹已经淡了。`},

      text:s => `王婶来串门，坐下没喝两口茶，就说起了给你说媒的事。对方是她娘家那边的，在供销社上班，人老实，家里负担不重。\n母亲听得很仔细，还问了生辰。父亲在一旁抽烟，没插嘴。\n你坐在里屋，听得见他们压低了声音说话。`,

        {t:'让母亲替你回绝', hint:'好感 ↑ · 心情 −', eff:{'好感':1,'心情':-2},

          return `母亲要去区里开三天会，临走前把一摞材料装进帆布包，又把粮本和钥匙交代给父亲。\n父亲把这几天做饭、接送的事都揽了下来，说：“你安心开会，家里有我。”\n你站在门口，看母亲推着自行车出去，车铃响了一声。`;

        }
        return `母亲这阵子单位事多，常常吃过饭还要在灯下忙到很晚。\n父亲把洗碗、扫地这些活接了过去，说：“你忙你的。”`;

          r:s => `你帮母亲把材料按页码排好，又替她把钢笔灌满墨水。\n她摸了摸你的头，说：“等开完会，带你去新华书店。”`},
        {t:'送母亲到巷口', hint:'心情 ↑ · 好感 ↑ · 见闻 ↑', eff:{'心情':3,'好感':2,'见闻':0.5}, affRel:'母亲',

            : `你把饭做上，又把桌子擦干净。父亲回来时愣了一下。\n母亲回来，把包里剩的半截粉笔放在你桌上。`},

          r:s => `夜校在一间旧教室里，黑板上的字写得很大。母亲坐在第二排，背挺得很直。\n回来的路上，她给你讲了半路课上的内容，你居然听懂了。`},

  function finalQuestions(stage){

    const s = gameState;

    const counts = {'小学':5, '初中':8, '高中':10};
    const need = counts[stage] || 5;
    const humanNeed = stage === '小学' ? 3 : (stage === '初中' ? 5 : 6);
    const allHuman = (HUMAN_BANK[stage] || []);
    const allMath = (FINAL_BANK[stage] || []);
    const human = allHuman.filter(q => seen.indexOf(q.q) < 0);
    const math = allMath.filter(q => seen.indexOf(q.q) < 0);
    const humanPool = human.length >= humanNeed ? human : allHuman.slice();
    const mathPool = math.length >= (need - humanNeed) ? math : allMath.slice();
    const out = [];
    while(out.length < humanNeed && humanPool.length){
      out.push(humanPool.splice(ri(0, humanPool.length - 1), 1)[0]);
    }
    while(out.length < need && mathPool.length){
      out.push(mathPool.splice(ri(0, mathPool.length - 1), 1)[0]);
    }
    s.flags.seenExamQ[stage] = seen.concat(out.map(q => q.q)).slice(-400);
    return out;
  }

  function refreshAcademic(p){

      if(!n.job || n.job === '在家' || /小学生/.test(n.job)) n.job = '小学生';
    }else if(n.age < 16){
      n.edu = '初中';
      if(!n.job || n.job === '在家' || /小学生/.test(n.job)) n.job = '初中生';
    }else if(n.age < 19){
      n.edu = '高中';
      if(!n.job || n.job === '在家' || /小学生|初中生/.test(n.job)) n.job = '高中生';
    }else if(n.age < 23){
      n.edu = '大学';
      if(!n.job || n.job === '在家' || /小学生|初中生|高中生/.test(n.job)) n.job = '大学生';
    }
  }

  function normalizeNpcs(s){
    (s.npcs || []).forEach(n => {
      if((n.relation === '父亲' || n.relation === '母亲') && !n.traits) n.traits = pickParentTraits();
      if(n.age < 7) n.edu = '未上学';
      else if(n.age < 13 && (!n.edu || n.edu === '初中' || n.edu === '高中')) n.edu = '小学';
      else if(n.age >= 13 && n.age < 16 && (n.edu === '高中' || n.edu === '未上学')) n.edu = '初中';
      else if(n.age >= 16 && n.age < 19 && n.edu === '未上学') n.edu = '高中';
      if(n.relation === '大院孩子' && n.age > (s.player.age || 0) + 4){
        n.age = Math.max(2, (s.player.age || 0) + 2);
      }
      if(n.relation === '玩伴' && n.age < (s.player.age || 0) - 2){
        n.age = Math.max(7, (s.player.age || 0) + ri(-1, 1));
      }
      if((n.relation === '导师' || n.relation === '同学') && /大学/.test(n.job || '') &&
         s.player && n.name.charAt(0) === s.player.surname){
        n.name = uniPersonName(s, n.gender);
      }
      syncNpcStage(n);
    });
    try{ ensureUniNpcs(s); }catch(e){}
  }

  function normalizePlayer(p){
    p.skills = p.skills || {};
    if(p.skills['学业'] === undefined){
      p.skills['学业'] = clamp(r1(((p.skills['学业'] || 0) || 0) * 0.55 + ((p.skills['学业'] || 0) || 0) * 0.45), 0, 100);
    }
    delete (p.skills['学业'] || 0);
    delete (p.skills['学业'] || 0);
    SKILL_KEYS.forEach(k => { if(p.skills[k] === undefined) p.skills[k] = 0; });
    p.exams = p.exams || [];
    if(p.academicScore === undefined){
      const ave = p.exams.length ? p.exams.reduce((a, x) => a + x.pct, 0) / p.exams.length : (p.skills['学业'] || 0);
      p.academicScore = Math.round(ave * 0.65 + (p.skills['学业'] || 0) * 0.35);
    }
    refreshAcademic(p);
  }
  const SAVE_KEY = 'nianDaiLife_save';
  const BACKUP_KEY = 'nianDaiLife_backup';

  const LEGACY_SAVE_KEYS = ['nianDaiLife_v4','nianDaiLife_v3','nianDaiLife_v2','nianDaiLife_v1'];

  const AFF_DEFAULT = {
    coal:'玩伴', movie:'弟妹', grain:'王婶', sewing:'母亲', model:'父亲',
    lost:'母亲', rain:'父亲', bike:'兄姐', spring:'母亲', sick:'母亲',
    radio:'母亲', ice:'母亲', grandma:'祖辈', apprentice:'父亲',
    army:'母亲', quiet:'母亲', match:'母亲'
  };

  function findNpc(name){
    return gameState.npcs.find(n => n.name === name);
  }

  function applyEffects(eff, targetName){
    const s = gameState, p = s.player, f = s.family;
    const out = [];
    if(!eff) return out;

    Object.keys(eff).forEach(k => {
      const v = eff[k];
      if(!v) return;

      if(k === '心情'){
        p.mood = clamp(p.mood + v, 0, 100);
        out.push({label:'心情', v:v});
      }else if(k === '健康'){
        p.health = clamp(p.health + v, 0, 100);
        out.push({label:'健康', v:v});
      }else if(k === '私房钱'){
        p.money = Math.max(0, r2(p.money + v));
        out.push({label:'私房钱', v:v, unit:'元'});
      }else if(k === '家庭存款'){
        f.cash = r2(f.cash + v);
        out.push({label:'家庭存款', v:v, unit:'元'});
      }else if(k === '粮票'){
        f.ration = Math.max(0, f.ration + v);
        out.push({label:'粮票', v:v, unit:'斤'});
      }else if(k === '存粮'){
        f.grain = Math.max(0, f.grain + v);
        out.push({label:'存粮', v:v, unit:'斤'});
      }else if(k === '煤球'){
        f.coal = Math.max(0, f.coal + v);
        out.push({label:'煤球', v:v, unit:'斤'});
      }else if(k === '口碑'){
        p.rep = clamp(p.rep + v, 0, 100);
        out.push({label:'名声', v:v});
      }else if(k === '好感父母'){
        ['父亲','母亲'].forEach(rel => {
          const n = gameState.npcs.find(x => x.relation === rel);
          if(n) n.affinity = clamp(n.affinity + v, 0, 100);
        });
        out.push({label:'父母好感', v:v});
      }else if(k === '好感'){
        const n = findNpc(targetName);
        if(n){
          n.affinity = clamp(n.affinity + v, 0, 100);
          out.push({label:'好感·' + n.name, v:v});
        }
      }else if(k === '识字' || k === '算术'){
        p.skills['学业'] = clamp((p.skills['学业'] || 0) + v, 0, 100);
        out.push({label:'学业', v:v});
      }else if(SKILL_KEYS.indexOf(k) >= 0){
        p.skills[k] = clamp((p.skills[k] || 0) + v, 0, 100);
        out.push({label:k, v:v});
      }
    });

    p.mood = r1(p.mood);
    p.health = r1(p.health);
    return out;
  }

  function resolveAff(s, key){
    if(!key) return null;
    let n = s.npcs.find(x => x.name === key);
    if(n) return n.name;
    if(key === '兄弟姐妹'){
      n = s.npcs.find(x => x.relation === '弟弟' || x.relation === '妹妹') ||
          s.npcs.find(x => x.relation === '哥哥' || x.relation === '姐姐');
    }else if(key === '玩伴'){
      n = s.npcs.find(x => x.relation === '玩伴');
    }else if(key === '弟妹'){
      n = s.npcs.find(x => x.relation === '弟弟' || x.relation === '妹妹');
    }else if(key === '兄姐'){
      n = s.npcs.find(x => x.relation === '哥哥' || x.relation === '姐姐');
    }else if(key === '祖辈'){
      n = s.npcs.find(x => x.relation === '奶奶' || x.relation === '爷爷');
    }else{
      n = s.npcs.find(x => x.relation === key);
    }
    return n ? n.name : null;
  }

  function makeOption(o, s, affDefault){
    let target = o.target || null;
    if(!target && o.eff && o.eff['好感']){
      target = resolveAff(s, o.affRel || affDefault || '母亲');
    }
    return {
      text:o.t,
      hint:o.hint || '',
      eff:o.eff || {},
      target:target,
      quiz:!!o.quiz,
      quizKind:o.quizKind || null,
      quizMeta:o.quizMeta || null,
      school:o.school || null,
      tier:o.tier || null,
      edu:o.edu || null,
      after:(typeof o.after === 'function' ? o.after : null),
      res:(typeof o.r === 'function' ? o.r(s) : String(o.r || ''))
    };
  }

  function buildStory(ev){
    const s = gameState;
    const opts = (ev.options ? ev.options(s) : [])
      .filter(o => !o.cond || o.cond(s))
      .map(o => makeOption(o, s, AFF_DEFAULT[ev.id]));

    if(!opts.length){
      opts.push(makeOption({
        t:'什么也没有做', hint:'时间照旧往前走',
        eff:{}, r:() => '你什么也没有做。日子还是照旧往前走。'
      }, s));
    }

    const id = 'story_' + s.year + '_' + s.month + '_' + s.turn + '_' + ev.id;
    const title = (typeof ev.title === 'function') ? ev.title(s) : ev.title;

    storyData[id] = {
      id:id,
      kind:'event',
      tag:ev.tag || '家中琐事',
      title:title,
      location:ev.loc ? ev.loc(s) : (ev.tag === '大学' || ((ev.id === 'pocket' || ev.id === 'englishjob') && s.player.edu === '大学') ? uniLocation(s) : s.city.name + '·' + s.city.lane),
      text:ev.text(s),
      options:opts,
      delta:[],
      date:s.year + '年' + s.month + '月'
    };

    s.currentStoryId = id;
    currentStoryId = id;
    s.pendingChoice = true;
    if(!s.titlesSeen) s.titlesSeen = {};
    s.titlesSeen[title] = s.turn;

    if(ev.once) s.flags[ev.id] = true;
    if(ev.id === 'school') s.flags.schoolStorySeen = true;
    if(ev.id === 'pocket') s.flags.lastPocketTurn = s.turn;
    if(ev.id === 'talent'){
      if(s.flags.talentYear !== s.year){ s.flags.talentYear = s.year; s.flags.talentCount = 0; }
      s.flags.talentCount = (s.flags.talentCount || 0) + 1;
      s.flags.talentLast = s.turn;
    }
    if(!s.eventSeen) s.eventSeen = {};
    s.eventSeen[ev.id] = s.turn;
    s.recentEvents.push(ev.id);
    if(s.recentEvents.length > 8) s.recentEvents.shift();
    s.history.push({date:s.year + '年' + s.month + '月', event:title});
    if(s.history.length > 60) s.history.shift();
  }

  function bestHobby(s){
    const keys = ['唱歌','跳舞','画画','弹琴','练武','运动'];
    let best = {k:'唱歌', v:0};
    keys.forEach(k => { const v = s.player.skills[k] || 0; if(v > best.v) best = {k:k, v:v}; });

  function careerParent(s){
    const ps = s.npcs.filter(n => (n.relation === '父亲' || n.relation === '母亲') && n.job && n.job !== '退休');
    return ps.length ? ps[s.turn % ps.length] : null;
  }

  function rollParentCareer(s, n, support){
    if(!n) return;
    const odds = clamp(0.42 + support * 0.1 + (n.prodigy ? 0.18 : 0) + Math.min(0.15, (n.workYears || 0) * 0.01), 0.15, 0.9);
    n.workYears = (n.workYears || 0) + 1;
    if(chance(odds)){
      const highJob = /主任|院长|校长|参谋|连长|营长|团长/.test(n.job || '');
      if(!highJob){
        const titles = promoteTitles(n.job);
        n.promoTier = Math.min(2, (n.promoTier || 0) + 1);
        n.title = titles[n.promoTier];
      }
      const raise = 7 + ri(0, 9) + (n.prodigy ? 5 : 0);
      n.income = clamp(n.income + raise, 0, 240);
      s.family.cash = r2(s.family.cash + 4);
      n.mood = clamp(n.mood + 10, 0, 100);
      n.affinity = clamp(n.affinity + 3, 0, 100);
      n.history.push({d:s.year + '年' + s.month + '月', t:'评上了' + n.title});
      toast(n.name + '评上了' + n.title + '，月收入 +' + raise + '元');
    }else{
      n.mood = clamp(n.mood - 5, 0, 100);
      n.history.push({d:s.year + '年' + s.month + '月', t:'这回没评上'});
    }
    saveGame();
  }

  function finishHobbyQuiz(score, total, meta){
    const s = gameState;
    const hobby = meta.hobby || '';
    const round = meta.round || '初赛';
    const pass = total ? score / total >= .6 : false;
    if(!pass){
      const delta = applyEffects({'心情':-3,'口碑':-1}, null);
      const body = `你在${round}答对了 ${score} / ${total} 道，没能晋级。\n回去的路上，你把错题在脑子里过了一遍。`;
      const id = 'hobbyfail_' + s.year + '_' + s.turn;
      storyData[id] = {id:id, kind:'result', tag:'支线', title:hobby + '比赛·止步' + round,
        location:s.city.name + '·' + s.city.lane, text:body, options:[], delta:delta,
        date:s.year + '年' + s.month + '月'};
      s.currentStoryId = id; currentStoryId = id; s.pendingChoice = false;
      renderAll(); saveGame(); scrollStoryIntoView();
      return;
    }
    if(round === '决赛'){
      const skillGain = {};
      skillGain[hobby] = 3;
      const delta = applyEffects(Object.assign({'口碑':8,'心情':6,'人缘':2}, skillGain), null);
      s.flags['champion_' + hobby] = true;
      const body = `决赛你答对了 ${score} / ${total} 道，拿了名次。\n奖状贴在教室后墙上，母亲特意来看了一回。`;
      const id = 'hobbywin_' + s.year + '_' + s.turn;
      storyData[id] = {id:id, kind:'result', tag:'支线', title:hobby + '比赛·获奖',
        location:s.city.name + '·' + s.city.lane, text:body, options:[], delta:delta,
        date:s.year + '年' + s.month + '月'};
      s.currentStoryId = id; currentStoryId = id; s.pendingChoice = false;
      renderAll(); saveGame(); scrollStoryIntoView();
      return;
    }
    const trainGain = {};
    trainGain[hobby] = 1;
    applyEffects(trainGain, null);
    const next = round === '初赛' ? '复赛' : '决赛';
    const text = `${s.year}年${s.month}月，${hobby}${round}你答对了 ${score} / ${total} 道，进了${next}。\n` +
      `通知贴在区文化馆门口，你的名字在最后一行。`;
    const opts = [
      makeOption({t:'继续参加' + next, quiz:true, quizKind:'hobby', quizMeta:{hobby:hobby, round:next},
        eff:{'心情':1}, r:() => '你把比赛的曲子/套路又过了一遍。'}, s),
      makeOption({t:'到这儿就行，退赛', eff:{'心情':1}, r:() => '你把名额让了出去，说已经够了。'}, s)
    ];
    const id = 'hobbynext_' + hobby + '_' + s.turn;
    storyData[id] = {id:id, kind:'event', tag:'支线', title:hobby + '比赛·晋级' + next,
      location:uniLocation(s), text:text, options:opts, delta:[],
      date:s.year + '年' + s.month + '月'};
    s.currentStoryId = id; currentStoryId = id; s.pendingChoice = true;
    renderAll(); saveGame(); scrollStoryIntoView();
  }

  function resolveStudyAbroad(s){
    const p = s.player;
    s.flags.studyAbroadDone = true;
    const f = famNpc(s, '父亲'), m = famNpc(s, '母亲');
    const jobs = ((f && f.job) || '') + ' ' + ((m && m.job) || '');
    const military = /部队|军区|军人|武装部/.test(jobs);
    const secret = /机要|情报|保密|涉密|核心/.test(jobs);
    const rank = s.family.rank || 1;
    let chanceOk = .75;
    if(military && (rank >= 3 || secret)) chanceOk = .1;
    else if(military && rank === 2) chanceOk = .4;
    else if(military) chanceOk = .6;
    if(chance(chanceOk)){
      s.flags.studyAbroad = true;
      s.flags.abroadBranch = true;
      p.school = '海外大学（全额奖学金）';
      p.schoolTier = '海外';
      p.edu = '大学';
      s.plans = {};
      const delta = applyEffects({'心情':6,'见闻':3,'口碑':2}, null);
      const id = 'studyabroad_ok_' + s.year + '_' + s.month;
      storyData[id] = {id:id, kind:'result', tag:'升学', title:'出国留学',
        location:s.city.name + '·' + s.city.lane,
        text:`审批一层层过了。临走前，母亲把你的衣服叠了又叠。\n你带着一只旧箱子，登上了远行的火车。`,
        options:[], delta:delta, date:s.year + '年' + s.month + '月'};
      s.currentStoryId = id; currentStoryId = id; s.pendingChoice = false;
      s.history.push({date:s.year + '年' + s.month + '月', event:'出国留学'});
    }else{
      const delta = applyEffects({'心情':-5,'口碑':-1}, null);
      const reason = military && (rank >= 3 || secret)
        ? '家里在部队的岗位敏感，政审这一关没有过。'
        : (military ? '部队内部审批没有通过，单位没有出具同意出境的意见。' : '政审和出境审批没有通过。');
      const id = 'studyabroad_no_' + s.year + '_' + s.month;
      storyData[id] = {id:id, kind:'result', tag:'升学', title:'出国留学未成',
        location:s.city.name + '·' + s.city.lane,
        text:`材料退回来了。${reason}\n你只能回去参加高考。`,
        options:[], delta:delta, date:s.year + '年' + s.month + '月'};
      s.currentStoryId = id; currentStoryId = id; s.pendingChoice = false;
      s.history.push({date:s.year + '年' + s.month + '月', event:'出国留学未成'});
    }
    renderAll(); saveGame(); scrollStoryIntoView();
  }

    const p = s.player;
    return p.edu === '高中' && p.age >= 18 && !s.flags.baosong &&
      (p.skills['竞赛'] || 0) >= 80 && (p.skills['英语'] || 0) >= 80 &&
      (p.academicScore || 0) >= 80 && !s.flags.abroadDecision && !s.flags.abroad;

  function studyAbroadReview(s){
    const jobs = ((famNpc(s,'父亲')||{}).job||'') + ' ' + ((famNpc(s,'母亲')||{}).job||'');
    const military = /部队|军区|军人|武装部/.test(jobs);
    if(military && ((s.family.rank || 1) >= 3 || /机要|情报|保密|军工|尖端/.test(jobs))){
      return {ok:false, why:'部队政审没有通过，家里也不同意'};
    }
    if((s.family.debt || 0) > 60){
      return {ok:false, why:'家里拿不出担保，签证没有办下来'};
    }
    if(military && chance(.35)){
      return {ok:false, why:'部队审批层层卡住，最后没有放行'};
    }
    return {ok:true, why:'国外大学给了全额奖学金，政审也过了'};
  }

        r:() => '录取通知和奖学金证明一起寄到家里。\n你收拾行李，准备去' + name + '报到。'}, s));

      add('哈佛大学', '海外顶尖'); add('麻省理工学院', '海外顶尖'); add('斯坦福大学', '海外顶尖');

  function bdayMonthIndex(dateStr){
    const m = String(dateStr || '').match(/(\d{4})年(\d{1,2})月/);
    return m ? (+m[1]) * 12 + (+m[2]) : -1;
  }

  function birthdayDigest(s){
    const now = s.year * 12 + s.month;
    const acts = (s.choices || [])
      .filter(c => {
        const v = bdayMonthIndex(c.date);
        return v > 0 && v < now && now - v <= 12;
      })
      .map(c => String(c.text || ''));
    const has = (t, kws) => kws.some(k => t.indexOf(k) >= 0);
    const fix = t => t.replace(/^这顿碗筷你包了/, '把碗筷全包了').replace(/^这顿/, '把这顿');
    const help = [], study = [], fun = [], sick = [];
    acts.forEach(raw => {
      const t = fix(raw);
      if(has(t, ['病','卫生所','医院','发烧','咳嗽','吃药','打针'])) sick.push(t);
      else if(has(t, ['学','读','课本','识字','算术','作业','复习','考试','报纸','图书','练字','认字'])) study.push(t);
      else if(has(t, ['帮','扫','劈','挑','做饭','洗衣','缝','照顾','带弟','带妹','让给','糊','拾','喂','打水','生火','收拾','碗筷','干','陪','倒','讲','聊'])) help.push(t);
      else if(has(t, ['玩','逛','电影','戏','伙伴','疯','凑热闹','看热闹','听戏','跳房','捉迷藏','跑出去','疯跑'])) fun.push(t);
    });
    const hist = (s.history || [])
      .filter(hh => {
        const v = bdayMonthIndex(hh.date);
        const t = String(hh.event || '');
        return v > 0 && v <= now && now - v < 12 &&
          t.indexOf('生日') < 0 && t !== '十八岁' && t !== '六岁这年';
      })
      .map(hh => String(hh.event || '').replace(/^\d{4}年·/, ''));
    return {acts:acts, help:help, study:study, fun:fun, sick:sick, hist:hist};
  }

    ];

    const pickOf = (arr, k) => arr.length ? arr[k % arr.length] : null;
    const optSib = pickOf(sibOpts, h >> 2);
    const optMother = pickOf(momOpts, h >> 3);
    const optFather = pickOf(dadOpts, h >> 4);
    const optBuy = pickOf(buyOpts, h >> 5);
    const optChores = pickOf(choreOpts, h >> 6);
    const optWish = pickOf(wishOpts, h >> 7);

    const optSpecial = specialOpts.length ? specialOpts[h % specialOpts.length] : null;
    const pool = [optReward, optSpecial, optSib, optMother, optFather, optBuy, optChores, optWish].filter(Boolean);
    const chosen = [];
    if(optReward) chosen.push(optReward);
    if(optSpecial && chosen.indexOf(optSpecial) < 0) chosen.push(optSpecial);
    const rest = pool.filter(o => o !== optReward);
    const log = s.flags.bdayOptLog || [];
    const recentOpts = [].concat.apply([], log).concat(s.flags.lastBdayOpts || []);
    const start = h % Math.max(1, rest.length);
    const take = allowRepeat => {
      for(let i = 0; i < rest.length * 2 && chosen.length < 3; i++){
        const cand = rest[(start + i) % rest.length];
        if(chosen.some(o => o.t === cand.t)) continue;
        if(!allowRepeat && recentOpts.indexOf(cand.t) >= 0) continue;
        chosen.push(cand);
      }
    };
    take(false);
    take(true);
    s.flags.lastBdayOpts = chosen.map(o => o.t);
    log.push(chosen.map(o => o.t));
    s.flags.bdayOptLog = log.slice(-2);

    const id = 'birthday_' + s.year + '_' + s.month;
    storyData[id] = {
      id:id, kind:'event', tag:'生日', title:p.age + '岁生日',
      location:s.city.name + '·' + s.city.lane,
      text:text,
      options:chosen.map(o => makeOption(o, s)),
      delta:[],
      date:s.year + '年' + s.month + '月'
    };
    s.currentStoryId = id;
    currentStoryId = id;
    s.pendingChoice = true;
    if(!s.titlesSeen) s.titlesSeen = {};
    s.titlesSeen[p.age + '岁生日'] = s.turn;
    s.history.push({date:s.year + '年' + s.month + '月', event:p.age + '岁生日'});
  }

  function startQuiz(kind, qs, meta){
    const s = gameState;
    meta = meta || {};
    if(kind === 'final' && !qs) qs = finalQuestions(meta.stage);
    if(kind === 'junior' && !qs) qs = finalQuestions('小学');
    if(kind === 'senior' && !qs) qs = finalQuestions('初中').slice(0, 8);
    if(kind === 'gaokao' && !qs) qs = finalQuestions('高中');
    if(kind === 'abroad' && !qs) qs = ABROAD_QUIZ;
    if(kind === 'uniabroad' && !qs) qs = ABROAD_QUIZ;
    if(kind === 'baosong' && !qs) qs = finalQuestions('高中').slice(0, 8);
    if(kind === 'youth' && !qs) qs = finalQuestions('高中').slice(0, 8);
    if(kind === 'hobby' && !qs && meta) qs = hobbyQuestions(meta.hobby, meta.round);
    s.quiz = {kind:kind || 'entry', qs:qs || SCHOOL_QUIZ, i:0, score:0, meta:meta};
    renderQuiz();
  }

  function renderQuiz(){
    const s = gameState;
    if(!s.quiz) return;
    const qs = s.quiz.qs || SCHOOL_QUIZ;
    const q = qs[s.quiz.i];
    let html = '<div class="quiz-progress">第 ' + (s.quiz.i + 1) + ' / ' + qs.length + ' 题</div>' +
      '<div class="quiz-q">' + esc(q.q) + '</div><div class="quiz-opts">';
    q.a.forEach((a, i) => {
      html += '<button class="quiz-opt" type="button" data-i="' + i + '">' + esc(a) + '</button>';
    });
    const isFinal = s.quiz.kind === 'final';
    const isHobby = s.quiz.kind === 'hobby';
    const isBaosong = s.quiz.kind === 'baosong';
    const isSenior = s.quiz.kind === 'senior';
    const isGaokao = s.quiz.kind === 'gaokao';
    const isAbroad = s.quiz.kind === 'abroad' || s.quiz.kind === 'uniabroad';
    const isYouth = s.quiz.kind === 'youth';
    html += '</div><div class="quiz-note">' + (isFinal ? '答完交卷，成绩会记在册子上。' : '考的是常识，答对几道，老师心里有数。') + '</div>';
    openModal(isYouth ? '少年班选拔考试' : isBaosong ? '保送生内部考试' : isHobby ? (s.quiz.meta.hobby || '') + '比赛·' + (s.quiz.meta.round || '') : isFinal ? (s.quiz.meta.stage || '') + '期末考' : '入学考试', isYouth ? '少年班招生组监考' : isBaosong ? '高校招生组监考' : isHobby ? '评委席' : isFinal ? '班主任监考' : '陈老师监考', html);
    $('modalBody').querySelectorAll('.quiz-opt').forEach(btn => {
      btn.addEventListener('click', () => answerQuiz(parseInt(btn.getAttribute('data-i'), 10)));
    });
  }

  function answerQuiz(index){
    const s = gameState;
    if(!s.quiz) return;
    const qs = s.quiz.qs || SCHOOL_QUIZ;
    if(index === qs[s.quiz.i].c) s.quiz.score += 1;
    s.quiz.i += 1;
    if(s.quiz.i >= qs.length){
      const score = s.quiz.score;
      const kind = s.quiz.kind;
      const meta = s.quiz.meta || {};
      s.quiz = null;
      closeModal();
      if(kind === 'final'){
        finishFinalExam(score, qs.length, meta);
      }else if(kind === 'hobby'){
        finishHobbyQuiz(score, qs.length, meta);
      }else if(kind === 'junior'){
        finishJuniorExam(score, qs.length, meta);
      }else if(kind === 'baosong'){
        finishBaosongExam(score, qs.length, meta);
      }else if(kind === 'youth'){
        finishYouthExam(score, qs.length, meta);
      }else{
        s.player.schoolScore = score;
        buildSchoolChoice(score);
      }
    }else{
      renderQuiz();
    }
  }

  function buildSchoolChoice(score){
    const s = gameState;
    const worker = /工人|军人/.test(s.family.cls.name);
    const opts = [];

    function add(name, tier, hint, extra){
      opts.push({
        t:'上' + name + '（' + tier + '）',

    const fs = familySchool(s);
    if(score >= 3){
      add('第一中心小学', '重点', '识字 ↑ · 师资好 · 重点小学', '这所学校是区里最好的，教室有玻璃窗。');
    }
    if(score >= 3 && fs.name !== '街道中心小学' && fs.name !== '国棉三厂子弟小学'){
      add(fs.name, fs.tier, '识字 ↑ · ' + fs.desc, '这是按家里的情况能进的学校，考试分数也够。');
    }
    if(fs.name !== '国棉三厂子弟小学' && fs.name !== '街道中心小学'){

    opts.push({

      eff:{'识字':0.8,'心情':-1},

      r:() => '母亲说，再等一年也不迟。她把旧报纸裁成小本子，每天晚上教你认几个字。\n第二年再去报名时，你比别的孩子多认了一百多个字。'
    });

    const text = '陈老师把卷子收上去，当场用红笔批了。你答对了 ' + score + ' 道。\n' +
      '她看了看你，又看了看报名表上的家庭住址，说：“这几个学校，你们家里商量着定。”' +
      (score >= 3 ? '\n她的语气比刚才柔和了些。' : '');

    const id = 'school_choice_' + s.turn;
    storyData[id] = {
      id:id, kind:'event', tag:'成长', title:'录取通知',
      location:s.city.name + '·' + s.city.lane,
      text:text,
      options:opts.map(o => makeOption(o, s)),
      delta:[], date:s.year + '年' + s.month + '月'
    };
    s.currentStoryId = id;
    currentStoryId = id;
    s.pendingChoice = true;
    if(!s.titlesSeen) s.titlesSeen = {};
    s.titlesSeen['录取通知'] = s.turn;
    renderAll();
    saveGame();
    scrollStoryIntoView();
  }

  function monthDiff(s){
    return (s.year * 12 + s.month) - (s.player.birthY * 12 + s.player.birthM);
  }

  function freshName(s, g, surn){
    surn = surn || s.player.surname || pick(SURNAMES);
    const jobs = ((famNpc(s,'父亲')||{}).job || '') + ' ' + ((famNpc(s,'母亲')||{}).job || '');
    const eduFam = /教师|医生|主任|科员|干部|工程师|编辑/.test(jobs);
    const pool = g === '男' ? MALE_NAMES : (eduFam ? ELEGANT_FEMALE : FEMALE_NAMES);
    for(let i = 0; i < 60; i++){
      const nm = surn + pick(pool);
      if(!s.npcs.some(n => n.name === nm)) return nm;
    }
    return surn + (g === '男' ? '小满' : '小芹') + s.npcs.length;
  }

  function pickBabyStory(s){
    if(!s.babySeen) s.babySeen = {};
    const age = s.player.age;
    if(!s.babyCount) s.babyCount = {};
    const countOf = id => s.babyCount[id] || 0;
    let packs = [];
    BABY_SLICES.forEach(seed => {
      if(age < seed.ages[0] || age > seed.ages[1]) return;
      if(seed.when && !seed.when(s)) return;
      if(countOf(seed.id) >= (BABY_CAPS[seed.id] || 3)) return;
      const detail = seed.details.find(d => s.babySeen[seed.id + '|' + d] === undefined);
      if(detail) packs.push({seed:seed, detail:detail});
    });
    if(!packs.length){
      const eligible = BABY_SLICES.filter(seed => age >= seed.ages[0] && age <= seed.ages[1]);
      if(eligible.length){
        const min = Math.min.apply(null, eligible.map(seed => countOf(seed.id)));
        eligible.filter(seed => countOf(seed.id) === min).forEach(seed => {
          packs.push({seed:seed, detail:pick(seed.details)});
        });
      }
    }
    if(!s.titlesSeen) s.titlesSeen = {};
    // 同一年不重复同一种日常，也尽量不连着来
    if(!s.babyYearUsed) s.babyYearUsed = {};
    const yUsed = s.babyYearUsed[s.year] || (s.babyYearUsed[s.year] = {});
    const freshKind = packs.filter(it => !yUsed[it.seed.id]);
    if(freshKind.length) packs = freshKind;
    if(packs.length > 1 && s.flags.lastBabySlice){
      const alt = packs.filter(it => it.seed.id !== s.flags.lastBabySlice);
      if(alt.length) packs = alt;
    }
    const ageWord = ['襁褓','一岁','两岁','三岁','四岁','五岁'][age] || (age + '岁');
    const titleOf = it => ageWord + '·' + (typeof it.seed.title === 'function' ? it.seed.title(it.detail, s) : it.seed.title);
    const unseen = packs.filter(it => s.titlesSeen[titleOf(it)] === undefined);
    if(unseen.length) packs = unseen;
    const item = pick(packs);
    s.babySeen[item.seed.id + '|' + item.detail] = s.turn;
    s.babyCount[item.seed.id] = countOf(item.seed.id) + 1;
    yUsed[item.seed.id] = 1;
    s.flags.lastBabySlice = item.seed.id;

    // 小孩子长得快：每次日常之后往前走几个月，遇到生日、节点或弟妹出生就停下
    if(!s.flags.slowBaby){
      const d0 = monthDiff(s);
      let key = Infinity;
      MILESTONES.forEach(m => { if(m.diff > d0) key = Math.min(key, m.diff); });
      if(d0 < 6) key = Math.min(key, 6);
      const nb = (Math.floor(d0 / 12) + 1) * 12;
      if(nb > d0) key = Math.min(key, nb);
      (s.flags.pendingBirths || []).forEach(b => {
        if(b.diff > d0) key = Math.min(key, b.diff);
        if(b.diff - 9 > d0) key = Math.min(key, b.diff - 9);
      });
      s.flags.skipTo = Math.min(d0 + 3, key);
    }
    let title = titleOf(item);
    if(s.titlesSeen[title] !== undefined) title += '·又';
    return {
      id:'baby_' + item.seed.id + '_' + s.turn,
      tag: age <= 1 ? '襁褓' : (age <= 3 ? '幼年' : '童年'),
      title:title,
      text:s => item.seed.text(item.detail, s),
      options:s => item.seed.opts(item.detail, s)
    };
  }

  function kidFor(s, key){
    s.flags = s.flags || {};
    s.flags.kidCache = s.flags.kidCache || {};
    const k = s.year + '_' + s.month + '_' + key;
    if(!s.flags.kidCache[k]){
      const g = chance(.5) ? '男' : '女';
      const fams = [
        '他爹在国棉三厂上班，娘在街道缝纫组。',
        '他家开着铁器社，院里整天叮叮当当。',
        '他娘是小学老师，家里有半箱子旧书。',
        '他爹是运输公司的司机，常年不在家。',
        '他家孩子多，粮食总不够吃。'
      ];
      const bgRaw = pick(fams);
      const eduFam = /老师|教师|医生|干部|书/.test(bgRaw);
      const pool = g === '男' ? MALE_NAMES : (eduFam ? ELEGANT_FEMALE : FEMALE_NAMES);
      let nm = '';
      for(let i = 0; i < 60; i++){
        const cand = pick(SURNAMES) + pick(pool);
        if(!s.npcs.some(n => n.name === cand)){ nm = cand; break; }
      }
      if(!nm) nm = '小' + (g === '男' ? '林' : '芸') + s.npcs.length;
      s.flags.kidCache[k] = {
        name:nm, gender:g, age:Math.max(2, s.player.age + ri(-1, 2)),
        bg:pron(bgRaw, g)
      };
    }
    return s.flags.kidCache[k];
  }

  function addKidParent(s, c){
    if(!c) return null;
    if(s.npcs.filter(n => n.relation === '叔叔' || n.relation === '阿姨').length >= 2) return null;
    const g = chance(.5) ? '男' : '女';
    const surname = c.name.charAt(0);
    const nm = freshName(s, g, surname);
    const n = makeNpc({
      name:nm, relation:g === '男' ? '叔叔' : '阿姨', gender:g,
      age:ri(28, 44),
      job:pick(['国棉三厂·挡车工','街道缝纫组·裁缝','小学·教师','供销社·售货员','机器厂·钳工','街道工厂·工人']),
      income:ri(20, 40), affinity:ri(42, 58), inFamily:false, mood:ri(60, 86)
    });
    n.bg = c.name + '的' + (g === '男' ? '爹' : '娘') + '，因为两个孩子来往，跟你们家熟了。';
    n.talent = pick(['识字','算术','手艺','见闻','胆量','人缘']);
    n.taughtTurn = -99;
    n.thought = npcThought(n, s);
    s.npcs.push(n);
    return n;
  }

  function addKidFriend(s, c){
    if(!c) return null;
    let n = s.npcs.find(x => x.name === c.name);
    if(!n){
      n = makeNpc({
        name:c.name, relation:'玩伴', gender:c.gender, age:c.age,
        job:'在家', income:0, affinity:ri(48,64), inFamily:false, mood:ri(68,90)
      });
      n.bg = c.bg;
      n.talent = pick(['识字','算术','手艺','见闻','胆量','人缘']);
      n.taughtTurn = -99;
      n.thought = npcThought(n, s);
      s.npcs.push(n);
    }
    if(chance(.5)) addKidParent(s, c);
    return n;
  }

  function stagePeople(s){
    const p = s.player;
    if(!p || p.edu !== '大学') return s.npcs.slice();
    return s.npcs.filter(n => {
      if(n.inFamily) return true;
      if(n.relation === '导师' || n.relation === '同学' || n.relation === '朋友' || n.relation === '室友') return true;
      return /大学|学院/.test(n.job || '') || n.edu === '大学';
    });
  }

  function uniClassmatesOf(s){
    return classmatesOf(s).filter(n => /大学/.test(n.job || '') || n.edu === '大学');
  }

  function uniProfessor(s){
    ensureUniNpcs(s);
    return s.npcs.find(n => n.relation === '导师') || null;

  function uniPersonName(s, g){
    for(let i = 0; i < 80; i++){
      const sn = pick(SURNAMES);
      if(sn === s.player.surname) continue;
      const nm = freshName(s, g, sn);
      if(nm.charAt(0) !== s.player.surname) return nm;
    }
    return freshName(s, g, '陈');
  }

  function ensureUniNpcs(s){
    if(!s.player || s.player.edu !== '大学') return;
    ensureUniClassmates(s);
    if(s.npcs.some(n => n.relation === '导师')) return;
    const g = chance(.5) ? '男' : '女';
    const nm = uniPersonName(s, g);
    const prof = makeNpc({
      name:nm, relation:'导师', gender:g, age:ri(42, 60),
      job:'大学·教授', income:ri(90, 130), affinity:ri(42, 58), inFamily:false, mood:ri(62, 82)

    const fresh = base.filter(e => seen[e.id] === undefined || (e.repeatIf && e.repeatIf(s)));

    const slice = makeSlice(s);

  function makeSlice(s){
    if(!s.sliceSeen) s.sliceSeen = {};
    if(!s.seedSeen) s.seedSeen = {};
    const seen = s.sliceSeen;
    const season = ['开春','入夏','秋后','冬月'][Math.floor(((s.month - 1) % 12) / 3)];

    function collect(useCooldown){
      const packs = [];
      const sliceSource = s.player.edu === '大学' ? UNI_SLICE_SEEDS : SLICE_SEEDS;
      sliceSource.forEach(seed => {
        if(seed.months && seed.months.indexOf(s.month) < 0) return;
        let maxAge = seed.ages ? seed.ages[1] : 70;
        if(seed.id === 'exam') maxAge = 16;
        else if(maxAge <= 18) maxAge = 70; // 成年后继续可用，学校类除外
        if(s.player.age < seed.ages[0] || s.player.age > maxAge) return;
        if(useCooldown && s.turn - (s.seedSeen[seed.id] === undefined ? -999 : s.seedSeen[seed.id]) < 18) return;

        const bare = seed.details.filter(d => seen[seed.id + '|' + d] === undefined);
        if(bare.length){
          packs.push({seed:seed, detail:pick(bare), season:null, weight:seed.w || 1});
          return;
        }
        const firstDetail = seed.details.find(d => seen[seed.id + '|' + d + '|' + season] === undefined);
        if(firstDetail){
          packs.push({seed:seed, detail:firstDetail, season:season, weight:(seed.w || 1) * 0.6});
        }
      });
      return packs;
    }

    if(!s.titlesSeen) s.titlesSeen = {};
    const titleOf = it => it.season ? it.season + '·' + it.seed.title(it.detail) : it.seed.title(it.detail);
    let packs = collect(true).filter(it => s.titlesSeen[titleOf(it)] === undefined);
    if(!packs.length) packs = collect(false).filter(it => s.titlesSeen[titleOf(it)] === undefined);
    if(!packs.length) return makeFiller(s);

    const item = weighted(packs);
    const seed = item.seed;
    const sig = seed.id + '|' + item.detail + (item.season ? '|' + item.season : '');
    seen[sig] = s.turn;
    s.seedSeen[seed.id] = s.turn;

    const baseTitle = seed.title(item.detail);
    return {
      id:'slice_' + seed.id,
      tag:seed.tag,
      title:item.season ? item.season + '·' + baseTitle : baseTitle,
      text:() => (item.season ? '这年' + item.season + '。' : '') + seed.text(s, item.detail),
      options:() => seed.options(s, item.detail),
      w:seed.w || 1
    };
  }

  function handleOptionClick(index){
    const s = gameState;
    const node = storyData[s.currentStoryId];
    if(!node || node.kind === 'result') return;
    const opt = node.options[index];
    if(!opt) return;

    if(opt.school){
      s.player.school = opt.school;
      s.player.schoolTier = opt.tier || '普通';
      s.player.schoolYear = s.year;
      s.player.edu = opt.edu || '小学';
      ensureTeacher(s);
    }
    if(typeof opt.after === 'function'){ try{ opt.after(s, opt); }catch(e){} }
    const delta = applyEffects(opt.eff, opt.target);
    const rid = 'result_' + s.year + '_' + s.month + '_' + s.turn;

    storyData[rid] = {
      id:rid, kind:'result', tag:'选择之后',
      title:node.title,
      location:node.location,
      text:opt.res,
      options:[], delta:delta,
      date:s.year + '年' + s.month + '月'
    };

    s.currentStoryId = rid;
    currentStoryId = rid;
    s.pendingChoice = false;
    s.choices.push({date:s.year + '年' + s.month + '月', text:opt.text});
    if(s.choices.length > 60) s.choices.shift();

    renderAll();
    saveGame();
    scrollStoryIntoView();
    if(opt.quiz) setTimeout(() => startQuiz(opt.quizKind, null, opt.quizMeta), 260);
  }

  function stepMonth(){
    const s = gameState;
    s.month += 1;
    if(s.month > 12){ s.month = 1; s.year += 1; }
    s.turn += 1;
    ensureAfter(s);

    if(s.month === s.player.birthM && s.year > s.player.birthY){
      s.player.age += 1;
    }
    refreshAcademic(s.player);
    if(s.player.age >= 6) ensureTeacher(s);
    if(s.player.age >= 18 && s.player.school && s.player.edu === '高中'){
      if(s.flags.baosong && !s.flags.baosongExamDone){
        // 等保送生内部考试
      }else if(s.flags.baosong && s.flags.baosongExamDone){
        // 已在学校选项里定下
      }else if(studyAbroadEligible(s) && !s.flags.abroadDecision){
        s.flags.abroadPending = true;
      }else if(!s.flags.gaokaoDone){
        s.flags.gaokaoPending = true;
      }
    }
    if(s.player.age >= 18 && s.player.school && s.player.edu === '中专'){
      s.player.school = null;
    }
    if(s.player.age >= 22 && s.player.school && s.player.edu === '大学'){
      s.player.school = null;
    }


    s.npcs.forEach(n => {
      if(!n.alive || n.birthM !== s.month) return;
      n.age += 1;
      syncNpcStage(n);
      if(n.age === 16 && /学徒/.test(n.job || '')){
        n.income = Math.max(n.income || 0, 18);
      }
      if(n.age === 18 && /学徒/.test(n.job || '')){
        n.job = n.job.replace('学徒','正式工');
        n.income += 10;
      }
      if(n.age === 60 && n.income > 0){
        n.job = '退休';
        n.income = 12;
      }
    });

    const eco = monthlyEconomy();
    monthlyGrowth();
    refreshAcademic(s.player);
    checkHobbyMastery(s);
    if(s.player.edu === '大学'){
      s.flags.compSponsor = null;
      ensureUniNpcs(s);
      if(s.player.uniGradeYear && s.year > s.player.uniGradeYear){
        s.player.uniGrade = clamp((s.player.uniGrade || 1) + (s.year - s.player.uniGradeYear), 1, 4);
        s.player.uniGradeYear = s.year;
      }
    }
    if(s.flags.compSponsor && (s.player.skills['学业'] || 0) < 40){
      s.flags.compSponsor = null;
      toast('学业掉得太厉害，竞赛资助取消了');
    }
    npcDailyLife();

    if(s.player.health <= 3){
      s.player.health = 8;
      s.player.mood = clamp(s.player.mood - 4, 0, 100);
    }
    return eco;
  }

  function advanceMonth(){
    const s = gameState;
    if(s.pendingChoice){
      toast('先把眼前的事做个了断');
      return;
    }

    // 上学时，先把当月放学后的安排定下来
    const stNow = schoolStageOf(s);
    ensureAfter(s);
    if(stNow && !s.after.done){
      const mode = isVacation(s) ? 'vac' : 'term';
      s.plans = s.plans || {};
      let plan = s.plans[mode];
      if(plan && plan.stage !== stNow.name){
        s.plans[mode] = null;
        plan = null;
        toast('升入' + stNow.name + '，连续计划已中断，请重新安排');
      }
      if(plan){
        const res = applyAfterItems(s, plan.items, plan.secret);
        if(res.error){
          s.plans[mode] = null;
          toast('连续计划中断：' + res.error);
        }else{
          plan.left -= 1;
          plan.names = res.names;
          if(plan.left <= 0){
            s.plans[mode] = null;
            toast('连续计划结束，下个月请重新安排');
          }else{
            toast('按连续计划安排：' + res.names.join('、') + (res.secret ? '（私房钱）' : ''));
          }
        }
      }
    }
    if(stNow && !s.after.done){
      openAfterSchool();
      toast('先把放学后的安排定下来');
      return;
    }

    let eco = stepMonth();

    // 婴幼儿阶段可以把日子快进到下一个节点
    if(s.flags.skipTo){
      let guard = 0;
      while(monthDiff(s) < s.flags.skipTo && guard < 24){
        eco = stepMonth();
        guard++;
      }
      s.flags.skipTo = 0;
    }

    pickMonthStory();

    renderAll();
    saveGame();
    scrollStoryIntoView();
    toast(s.year + '年' + s.month + '月 · 收入 ' + fmtY(eco.income) + ' · 开销 ' + fmtY(eco.expense));
  }

  function scrollStoryIntoView(){
    const el = $('storyCard');
    if(!el) return;
    try{
      const content = $('content');
      const top = el.offsetTop - 8;
      if(content && typeof content.scrollTo === 'function'){
        content.scrollTo({top:top, behavior:'smooth'});
      }else if(el.scrollIntoView){
        el.scrollIntoView({behavior:'smooth', block:'start'});
      }
    }catch(e){}
  }

  function saveGame(){
    try{
      const prev = localStorage.getItem(SAVE_KEY);
      if(prev) localStorage.setItem(BACKUP_KEY, prev);
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        s:gameState, sd:storyData, cs:currentStoryId
      }));
    }catch(e){}
  }

  function migrateOldStories(){
    Object.keys(storyData).forEach(id => {
      const n = storyData[id];
      if(!n || n._patched2) return;
      if(!/认亲/.test(n.title || '') && n.title !== '过年·认长辈') return;
      n._patched2 = true;
      const t = String(n.title || '');
      const momSide = /外公|外婆|舅舅|姨妈/.test(t);
      n.title = momSide ? '过年·妈妈这边' : '过年·爸爸这边';
      n.text = momSide
        ? '过年，母亲这边的亲戚都来了：外公外婆、舅舅姨妈坐了一屋子。母亲让你挨个叫人。'
        : '过年，父亲这边的亲戚都来了：爷爷奶奶、姑姑叔叔坐了一屋子。母亲让你挨个叫人。';
      (n.options || []).forEach(o => {
        if(o.eff && /红包/.test(o.res || '')){
          o.eff['私房钱'] = Math.round((o.eff['私房钱'] || 0) * 10 + 1) / 10;
          o.eff['好感父母'] = 1;
        }
      });
    });
  }

  function loadGame(){
    try{
      const keys = [SAVE_KEY, BACKUP_KEY, SNAPSHOT_KEY].concat(LEGACY_SAVE_KEYS);
      let best = null, bestRaw = null;
      keys.forEach(k => {
        let raw = null;
        try{ raw = localStorage.getItem(k); }catch(e){}
        if(!raw) return;
        let data = null;
        try{ data = JSON.parse(raw); }catch(e){ return; }
        if(!data || !data.s || !data.sd || !data.s.player) return;
        if(!data.sd[data.cs || data.s.currentStoryId]) return;
        const turn = (data.s.turn || 0);
        if(!best || turn > (best.s.turn || 0)){ best = data; bestRaw = raw; }
      });
      if(!best) return false;
      try{
        const oldSnap = JSON.parse(localStorage.getItem(SNAPSHOT_KEY) || 'null');
        if(!oldSnap || !oldSnap.s || (best.s.turn || 0) >= (oldSnap.s.turn || 0)){
          localStorage.setItem(SNAPSHOT_KEY, bestRaw);
        }
      }catch(e){}
      try{ localStorage.setItem(SAVE_KEY, bestRaw); }catch(e){}
      gameState = best.s;
      try{ normalizePlayer(gameState.player); }catch(e){}
      try{ normalizeNpcs(gameState); }catch(e){}
      try{
        const pl = gameState.player;
        if(pl){
          pl.roles = (pl.roles || []).filter((r, i, arr) => arr.indexOf(r) === i);
          const addRole = r => { if(pl.roles.indexOf(r) < 0) pl.roles.push(r); };
          const choiceTexts = (gameState.choices || []).map(c => c.text || '').join(' ');
          if(/报名学生会/.test(choiceTexts)){ addRole('学生会干事'); gameState.flags.unionRole = gameState.flags.unionRole || '学生会干事'; }
          if(/把活动办漂亮/.test(choiceTexts)){ addRole('学生会部长'); gameState.flags.unionRole = '学生会部长'; }
        }
        if(pl && pl.edu === '大学' && gameState.flags.compSponsor){
          gameState.flags.compSponsor = null;
        }
        if(pl && pl.edu === '大学' && !pl.uniGrade){
          const g = clamp((pl.age || 18) - 17, 1, 4);
          pl.uniGrade = g;
          pl.uniGradeYear = best.s.year;
          pl.uniStartYear = best.s.year - (g - 1);
          if(gameState.flags.youthClass) pl.age = 16 + (g - 1);
        }
        if(pl && pl.age >= 15 && pl.age <= 16 && pl.edu === '高中' && !gameState.flags.seniorExamDone){
          if(gameState.flags.baosong){
            gameState.flags.seniorExamDone = true;
            gameState.flags.upSenior = true;
          }else{
            const affMid = affiliatedSchool(pl.school, '初中');
            pl.school = affMid ? affMid.name : '街道初中';
            pl.schoolTier = affMid ? affMid.tier : '普通';
            pl.edu = '初中';
            gameState.flags.upJunior = true;
          }
        }
        if(pl && pl.school && /大学|学院/.test(pl.school) && pl.edu !== '大学'){
          pl.edu = '大学';
          gameState.flags.upCollege = true;
        }
        if(pl && gameState.flags.baosong && pl.age >= 15 && pl.edu === '初中'){
          const affHigh = affiliatedSchool(pl.school, '高中') || {name:'普通高中', tier:'普通'};
          pl.school = affHigh.name;
          pl.schoolTier = affHigh.tier;
          pl.edu = '高中';
          gameState.flags.seniorExamDone = true;
          gameState.flags.upSenior = true;
          gameState.flags.upJunior = true;
        }
        if(pl && gameState.flags.compBranch && !gameState.flags.baosong && !gameState.flags.abroad &&
           (pl.skills['竞赛'] || 0) >= 80 && pl.age >= 14){
          gameState.flags.compBranch = false;
          gameState.flags.compNext = 0;
        }
        if(pl && pl.edu === '小学' && pl.school && /初中|中学/.test(pl.school)){
          if(gameState.flags.juniorExamDone){
            pl.edu = '初中';
          }else{
            const fsFix = familySchool(gameState);
            pl.school = fsFix.name;
            pl.schoolTier = fsFix.tier;
          }
        }
      }catch(e){}
      try{
        const eduNow = gameState.player.edu || '';
        if(gameState.flags.baosong && !gameState.flags.baosongType){
          gameState.flags.baosongType = gameState.player.age <= 16 ? 'youth' : 'regular';
        }
        if(gameState.flags.baosong && (gameState.player.age < 13 || eduNow === '大学' || eduNow === '中专')) delete gameState.flags.baosong;
        if(gameState.flags.abroad && !gameState.flags.abroadSchool && !gameState.flags.abroadExchange && !/海外/.test(gameState.player.school || '')) delete gameState.flags.abroad;
      }catch(e){}
      try{ repairMilitarySchool(gameState); }catch(e){}
      storyData = best.sd;
      try{
        const curId = best.cs || best.s.currentStoryId;
        const curNode = storyData[curId];
        if(curNode && curNode.kind === 'event' && /手头有点紧|想自己挣点/.test(curNode.title || '')){
          curNode.title = '想自己攒点';
          curNode.text = `${best.s.year}年${best.s.month}月，你想自己攒点零花钱。\n` +
            `不想每回都向家里伸手，正好听说有零活可做。`;
        }
        if(curNode && /大学里的社团/.test(curNode.title || '') && best.s.flags.unionRole){
          curNode.title = '学生会与社团';
          curNode.text = `${best.s.year}年${best.s.month}月，学生会要开会，社团招新也还没结束。\n广播站、文学社都还在拉人，你既可以去学生会，也可以报个社团。\n两边不冲突，只是时间要自己安排。`;
          (curNode.options || []).forEach(o => {
            if(/报名学生会/.test(o.text || '')){
              o.text = '去学生会处理这个月的活';
              o.res = '你熟门熟路地领了任务，跑完通知又去搬桌子。\n学生会里的人都认得你了。';
            }
          });
        }
        if(curNode && /煤棚里的|粮站供应|供销社来了|母亲晚归|父亲晚归/.test(curNode.title || '') && best.s.player && best.s.player.edu === '大学'){
          curNode.kind = 'result';
          curNode.title = '大学里的旧事';
          curNode.text = `${best.s.year}年${best.s.month}月，这些家里缺煤缺粮的事已经离你远了。\n你现在在大学里，操心的是课表和食堂。`;
          curNode.options = [];
          curNode.delta = [];
          best.s.pendingChoice = false;
        }
        if(curNode && /跟师傅学手艺/.test(curNode.title || '') && best.s.player && best.s.player.edu === '大学'){
          curNode.kind = 'result';
          curNode.title = '旧事';
          curNode.text = `${best.s.year}年${best.s.month}月，街道木器社招徒弟的事已经过去了。\n你现在在大学里，那条巷子成了旧闻。`;
          curNode.options = [];
          curNode.delta = [];
          best.s.pendingChoice = false;
        }
        if(curNode && /^帮同学补课/.test(curNode.title || '') && best.s.player && best.s.player.edu === '大学'){
          curNode.kind = 'result';
          curNode.title = '大学里的互助';
          curNode.text = `${best.s.year}年${best.s.month}月，大学同学之间互相讲讲题，不再有家长按次给钱这回事。`;
          curNode.options = [];
          curNode.delta = [];
          best.s.pendingChoice = false;
        }
        if(curNode && /恢复高考/.test(curNode.title || '') &&
           ((best.s.year || 0) > 1979 || (best.s.player && best.s.player.edu === '大学'))){
          curNode.kind = 'result';
          curNode.title = '旧广播';
          curNode.text = `${best.s.year}年${best.s.month}月，广播里说的恢复高考已经是很多年前的事了。\n你现在在大学里，那条消息成了旧闻。`;
          curNode.options = [];
          curNode.delta = [];
          best.s.pendingChoice = false;
        }
        if(curNode && /开学申请/.test(curNode.title || '') && best.s.player && best.s.player.edu === '大学'){
          curNode.title = '大学奖助学金';
          curNode.tag = '大学';
          curNode.location = uniLocation(best.s);
          curNode.text = `${best.s.year}年${best.s.month}月，新学期开学。\n系里贴出奖学金和助学金的通知，按成绩和综测评。\n辅导员说，符合条件的自己写申请交上去。`;
          if(curNode.options){
            curNode.options.forEach(o => {
              o.res = String(o.res || '').replace(/班主任/g, '辅导员').replace(/母亲/g, '系里');
            });
          }
        }
        if(curNode && /街道来做动员/.test(curNode.title || '') &&
           ((best.s.year || 0) > 1979 || (best.s.player && best.s.player.edu === '大学'))){
          curNode.kind = 'result';
          curNode.title = '旧事';
          curNode.text = `${best.s.year}年${best.s.month}月，街道上说的那些事已经过去了。\n你现在在大学里，插队和顶班都成了旧闻。`;
          curNode.options = [];
          curNode.delta = [];
          best.s.pendingChoice = false;
        }
        if(curNode && /家长会/.test(curNode.title || '')){
          const goodGrade = /成绩是“优”|成绩是“良”/.test(curNode.text || '');
          if(goodGrade){
            curNode.text = String(curNode.text).replace(/母亲把围裙解了又系上，说还是她去。/, '母亲把外套扣好，说还是她去。');
            if(curNode.options && curNode.options[0] && /挨一顿说/.test(curNode.options[0].text || '')){
              curNode.options[0].text = '让母亲去，听听老师怎么夸';
              curNode.options[0].res = '母亲回来时脸上带着笑，把成绩单压在玻璃板下。\n晚上多炒了一个菜，说老师夸你坐得住。';
            }
          }
        }
      }catch(e){}
      try{
        const pl = gameState.player;
        if(pl && (!pl.exams || !pl.exams.length)){
          Object.keys(storyData).forEach(k => {
            const n = storyData[k];
            if(n && /家长会/.test(n.title || '') && /不合格/.test(n.text || '')){
              n.text = String(n.text).replace(/你这次的成绩是“不合格”。/, '你还没正式考过期末，成绩单上只有平时分。');
            }
          });
        }
      }catch(e){}
      currentStoryId = best.cs || best.s.currentStoryId;
      return true;
    }catch(e){ return false; }
  }

  function newGame(preset, setup){
    gameState = generateLife(preset || null, setup || null);
    normalizePlayer(gameState.player);
    storyData = {};
    currentStoryId = null;
    buildPrologue();
    renderAll();
    saveGame();
  }

  function resetGame(){
    try{
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem(BACKUP_KEY);
      localStorage.removeItem(SNAPSHOT_KEY);
      LEGACY_SAVE_KEYS.forEach(k => localStorage.removeItem(k));
    }catch(e){}
    closeModal();
    newGame();
    openFamilyPicker(true);
  }

  function moodMap(v){
    if(v >= 88) return '😄 喜气洋洋';
    if(v >= 72) return '🙂 心里轻快';
    if(v >= 58) return '😌 平静安稳';
    if(v >= 44) return '😐 说不上好坏';
    if(v >= 30) return '😔 有些发愁';
    if(v >= 16) return '😣 心事重重';
    return '😢 撑得辛苦';
  }

  function moodShort(v){
    if(v >= 85) return '欢喜';
    if(v >= 70) return '轻快';
    if(v >= 55) return '平静';
    if(v >= 40) return '发闷';
    if(v >= 25) return '发愁';
    return '难熬';
  }

  function healthShort(v){
    if(v >= 90) return '硬朗';

    if(v >= 45) return '有点虚';
    if(v >= 30) return '病恹恹';

    if(v >= 70) return '亲近';
